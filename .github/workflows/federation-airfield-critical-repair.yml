name: Federation Airfield Critical Silhouette Repair — Preview Only

# Reuse the successful Coalition/Psionic renders from the preserved failed
# artifact. Never rerender the validated factions or any five-frame atlas.
on:
  workflow_dispatch:
  push:
    branches: [asset-preview/three-faction-airfield-extended-states-20261028]
    paths:
      - ".github/workflows/federation-airfield-critical-repair.yml"

permissions:
  contents: read
  actions: read

concurrency:
  group: chrono-federation-airfield-critical-repair
  cancel-in-progress: true

jobs:
  targeted-repair:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Install QA dependencies and check source
        run: |
          python -m pip install --quiet Pillow
          python -m py_compile tools/blender/preview_airfield_extended_states.py tools/blender/qa_airfield_extended_states.py
      - name: Reuse previous three-faction preview artifact
        uses: actions/download-artifact@v4
        with:
          name: chrono-three-faction-airfield-extra-state-pilot
          run-id: 40642316525
          github-token: ${{ github.token }}
          path: generated/airfield-extra-preview
      - name: Verify preserved original atlases
        run: |
          set -euo pipefail
          stage=generated/airfield-extra-preview
          sha256sum --check "$stage/original-atlases.sha256"
          test -s "$stage/sources/federation-airfield.blend"
          test -s "$stage/extra/coalition/critical.png"
          test -s "$stage/extra/psionic/destroyed.png"
      - name: Cache official Blender 4.2.23 LTS
        uses: actions/cache@v4
        with:
          path: ~/.cache/chrono-blender/blender-4.2.23-linux-x64.tar.xz
          key: chrono-blender-4.2.23-linux-x64-official
      - name: Install checksum-verified Blender
        shell: bash
        run: |
          set -euo pipefail
          version=4.2.23
          name="blender-${version}-linux-x64.tar.xz"
          base="https://download.blender.org/release/Blender4.2"
          mkdir -p "$HOME/.cache/chrono-blender" "$RUNNER_TEMP/chrono-blender"
          archive="$HOME/.cache/chrono-blender/$name"
          if [[ ! -s "$archive" ]]; then
            curl --fail --location --retry 3 --retry-delay 4 --connect-timeout 25 --max-time 480 "$base/$name" --output "$archive"
          fi
          curl --fail --location --retry 3 --connect-timeout 20 --max-time 90 "$base/blender-${version}.sha256" --output "$RUNNER_TEMP/blender.sha256"
          grep -F "$name" "$RUNNER_TEMP/blender.sha256" | head -1 | (cd "$HOME/.cache/chrono-blender" && sha256sum --check)
          tar -xJf "$archive" -C "$RUNNER_TEMP/chrono-blender" --strip-components=1
          echo "$RUNNER_TEMP/chrono-blender" >> "$GITHUB_PATH"
      - name: Re-render ONLY the failed Federation critical geometry and its three sibling states
        shell: bash
        run: |
          set -euo pipefail
          stage=generated/airfield-extra-preview
          blender --background --threads 4 "$stage/sources/federation-airfield.blend" --python-exit-code 1 \
            --python tools/blender/preview_airfield_extended_states.py -- \
            --faction federation --output "$stage/extra/federation"
      - name: Reopen repaired editable Federation source
        shell: bash
        run: |
          set -euo pipefail
          stage=generated/airfield-extra-preview
          blender --background --threads 2 "$stage/extra/federation/federation-airfield-extended-states.blend" --python-exit-code 1 --python-expr \
            'import bpy; a=[o for o in bpy.data.objects if o.type=="MESH" and (o.name.startswith("Critical-only") or o.name.startswith("Destroyed-only"))]; assert len(a)==9; assert all(o.hide_render for o in a); print("REOPENED NINE HIDDEN EDITABLE FRACTURES")'
      - name: Verify all three factions at real 160px and 80px
        shell: bash
        run: |
          set -euo pipefail
          stage=generated/airfield-extra-preview
          python tools/blender/qa_airfield_extended_states.py --stage "$stage"
          sha256sum --check "$stage/original-atlases.sha256"
      - name: Upload preserved plus repaired preview-only artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: chrono-airfield-three-faction-validated-preview
          path: generated/airfield-extra-preview/
          retention-days: 30
          if-no-files-found: error
