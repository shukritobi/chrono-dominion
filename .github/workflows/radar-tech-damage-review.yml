name: Radar and Technology Lab MK-IV Physical Damage Review

# All geometry is original, generated by Blender in a preview-only directory.
# Never publish or modify approved game art or production manifests.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/radar-tech-damage-review.yml"
      - "tools/blender/qa_radar_tech_damage.py"

permissions:
  contents: read

concurrency:
  group: chrono-radar-tech-damage-preview
  cancel-in-progress: true

jobs:
  render-six:
    runs-on: ubuntu-24.04
    timeout-minutes: 65
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Python with Pillow
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Validate Blender modeling source before install
        run: |
          python -m py_compile tools/blender/building_architecture.py \
            tools/blender/animated_assets.py tools/blender/qa_radar_tech_damage.py \
            tools/blender/pack_animated.py tools/blender/asset_studio.py \
            tools/blender/radar_tech_wreckage.py
          python tools/blender/check_geometry_calls.py
          python -m pip install --quiet Pillow

      - name: Cache verified Blender 4.2.23 LTS binary
        uses: actions/cache@v4
        with:
          path: ~/.cache/chrono-blender/blender-4.2.23-linux-x64.tar.xz
          key: chrono-blender-4.2.23-linux-x64-official

      - name: Install verified official Blender binary without apt mirrors
        shell: bash
        run: |
          set -euo pipefail
          version=4.2.23
          name="blender-${version}-linux-x64.tar.xz"
          base="https://download.blender.org/release/Blender4.2"
          mkdir -p "$HOME/.cache/chrono-blender" "$RUNNER_TEMP/chrono-blender"
          archive="$HOME/.cache/chrono-blender/$name"
          if [[ ! -s "$archive" ]]; then
            curl --fail --location --retry 3 --retry-delay 4 \
              --connect-timeout 25 --max-time 480 \
              "$base/$name" --output "$archive"
          fi
          curl --fail --location --retry 3 --connect-timeout 20 \
            --max-time 90 "$base/blender-${version}.sha256" \
            --output "$RUNNER_TEMP/blender.sha256"
          grep -F "$name" "$RUNNER_TEMP/blender.sha256" | head -1 | \
            (cd "$HOME/.cache/chrono-blender" && sha256sum --check)
          tar -xJf "$archive" -C "$RUNNER_TEMP/chrono-blender" \
            --strip-components=1
          echo "$RUNNER_TEMP/chrono-blender" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/chrono-blender/blender" --version | head -2

      - name: Render six editable physically damaged radar and research buildings
        shell: bash
        run: |
          set -euo pipefail
          for kind in radar tech; do
            for faction in coalition federation psionic; do
              stage="generated/radar-tech-damage/$faction/$kind"
              echo "::group::Blender $faction / $kind"
              blender --background --threads 4 --python-exit-code 1 \
                --python tools/blender/animated_assets.py -- \
                --output "$stage" --kinds "$kind" --factions "$faction" --size 160
              python tools/blender/pack_animated.py \
                --input "$stage" --output "$stage/packed" --size 160
              python tools/blender/asset_studio.py validate \
                --stage "$stage" --faction "$faction" --kind "$kind"
              python tools/blender/asset_studio.py preview \
                --stage "$stage" --faction "$faction" --kind "$kind"
              test -s "$stage/sources/$faction-$kind.blend"
              blender --background --threads 2 \
                "$stage/sources/$faction-$kind.blend" --python-exit-code 1 \
                --python-expr 'import bpy; a=[o for o in bpy.data.objects if o.type=="MESH"]; assert len(a)>=16, len(a); assert any(any(t in o.name.lower() for t in ("rotat","scan","gyre","clamp")) for o in a); w=[o for o in a if o.name.startswith("Damage-only")]; assert len(w)>=8,(len(w),[o.name for o in w]); assert all(o.hide_render for o in w); print("REOPENED PHYSICAL DAMAGE SOURCE",len(a),len(w))'
              echo "::endgroup::"
            done
          done

      - name: Inspect six physical damage silhouettes at 160px and 80px
        run: python tools/blender/qa_radar_tech_damage.py

      - name: Upload six physical damage Blender sources, atlases and QA sheets
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: chrono-radar-tech-damage-six-asset-review
          path: generated/radar-tech-damage/
          if-no-files-found: warn
          retention-days: 30
