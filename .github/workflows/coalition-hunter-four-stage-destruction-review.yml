name: Coalition Hunter Four-Stage Destruction Blender Preview

# PREVIEW ONLY. Read-only Actions permissions. Never publish game art or manifests.
on:
  workflow_dispatch:
  push:
    branches:
      - asset-preview/coalition-hunter-four-stage-destruction-20261028
    paths:
      - .github/workflows/coalition-hunter-four-stage-destruction-review.yml
      - tools/blender/preview_coalition_hunter_four_stage_destruction.py
      - tools/blender/qa_coalition_hunter_four_stage_destruction.py

permissions:
  contents: read
  actions: read

concurrency:
  group: chrono-coalition-hunter-four-stage-destruction
  cancel-in-progress: true

jobs:
  destruction-review:
    runs-on: ubuntu-24.04
    timeout-minutes: 85
    steps:
      - name: Checkout isolated preview-only branch
        uses: actions/checkout@v4

      - name: Compile original Blender model and strict real-PNG QA
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile tools/blender/preview_coalition_hunter_four_stage_destruction.py tools/blender/qa_coalition_hunter_four_stage_destruction.py
          python -m pip install --quiet Pillow

      - name: Download previously validated Hunter Blender source and frames without rerender
        uses: actions/download-artifact@v4
        with:
          name: chrono-coalition-camouflage-hunter-32-preview
          run-id: 40648427473
          github-token: ${{ github.token }}
          path: archived-hunter-source

      - name: Check immutable original 32-facing atlas and editable source
        shell: bash
        run: |
          set -euo pipefail
          test -s archived-hunter-source/coalition-camouflage-hunter.blend
          test -s archived-hunter-source/coalition-camouflage-hunter-32-preview.png
          test -s archived-hunter-source/frames/idle/00.png
          test -s archived-hunter-source/frames/destroyed/31.png
          echo '9059f6d2c5dcaaae596a136ec9b2098973ee2c5ce830dd60857e165a4f38f08d  archived-hunter-source/coalition-camouflage-hunter-32-preview.png' | sha256sum --check
          sha256sum archived-hunter-source/coalition-camouflage-hunter-32-preview.png > "$RUNNER_TEMP/immutable-hunter.sha256"

      - name: Cache official Blender 4.2.23 LTS
        uses: actions/cache@v4
        with:
          path: ~/.cache/chrono-blender/blender-4.2.23-linux-x64.tar.xz
          key: chrono-blender-4.2.23-linux-x64-official

      - name: Install checksum-verified official Blender
        shell: bash
        run: |
          set -euo pipefail
          version=4.2.23
          name="blender-$version-linux-x64.tar.xz"
          base="https://download.blender.org/release/Blender4.2"
          mkdir -p "$HOME/.cache/chrono-blender" "$RUNNER_TEMP/chrono-blender"
          archive="$HOME/.cache/chrono-blender/$name"
          if [[ ! -s "$archive" ]]; then
            curl --fail --location --retry 3 --retry-delay 4 --connect-timeout 25 --max-time 480 "$base/$name" --output "$archive"
          fi
          curl --fail --location --retry 3 --connect-timeout 20 --max-time 90 "$base/blender-$version.sha256" --output "$RUNNER_TEMP/blender.sha256"
          grep -F "$name" "$RUNNER_TEMP/blender.sha256" | head -1 | (cd "$HOME/.cache/chrono-blender" && sha256sum --check)
          tar -xJf "$archive" -C "$RUNNER_TEMP/chrono-blender" --strip-components=1
          echo "$RUNNER_TEMP/chrono-blender" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/chrono-blender/blender" --version | head -2

      - name: Render only 128 NEW Hunter destruction frames
        shell: bash
        run: |
          set -euo pipefail
          blender --background --threads 4 archived-hunter-source/coalition-camouflage-hunter.blend --python-exit-code 1 --python tools/blender/preview_coalition_hunter_four_stage_destruction.py -- --output generated/coalition-hunter-destruction

      - name: Reopen saved editable Blender source and verify real physical fragments
        shell: bash
        run: |
          set -euo pipefail
          blender --background --threads 2 generated/coalition-hunter-destruction/coalition-hunter-four-stage-destruction.blend --python-exit-code 1 --python-expr 'import bpy; d=[o for o in bpy.data.objects if o.get("hunter_destruction_only")]; w=[o for o in bpy.data.objects if o.get("wreckage_only")]; v=[o for o in bpy.data.objects if o.name.startswith("Hunter independent optical camouflage vane hinge")]; r=[o for o in bpy.data.objects if o.name.startswith("Hunter independently articulated roadwheel")]; c=[o for o in bpy.data.objects if o.name.startswith("Hunter independent segmented tread cleat")]; a=[o for o in bpy.data.objects if o.get("attack_only")]; assert (len(d),len(w),len(v),len(r),len(c),len(a))==(18,14,4,8,24,3),(len(d),len(w),len(v),len(r),len(c),len(a)); assert all(o.type=="MESH" and len(o.data.vertices)==10 and len(o.data.polygons)==7 and o.hide_render for o in d); assert all(o.hide_render for o in w+a); assert sum(o.get("damage_role")=="seam" for o in d)==3; print("PASS REOPEN: 18 closed irregular physical fractures, 14 original wrecks, 4 vanes, 8 wheels, 24 cleats, 3 hidden attack effects")'

      - name: Inspect actual 160px/80px PNGs and immutable baseline SHA
        shell: bash
        run: |
          set -euo pipefail
          python tools/blender/qa_coalition_hunter_four_stage_destruction.py --stage generated/coalition-hunter-destruction --baseline archived-hunter-source
          sha256sum --check "$RUNNER_TEMP/immutable-hunter.sha256"
          test -s generated/coalition-hunter-destruction/coalition-hunter-destruction-contact-160.png
          test -s generated/coalition-hunter-destruction/coalition-hunter-destruction-contact-80.png
          test -s generated/coalition-hunter-destruction/coalition-hunter-destruction-facing04-80px.gif
          test -s generated/coalition-hunter-destruction/pixel-qa.json

      - name: Upload preview-only editable Blender source, 128 frames and QA even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: chrono-coalition-hunter-four-stage-destruction-preview
          path: generated/coalition-hunter-destruction/
          if-no-files-found: warn
          retention-days: 30
