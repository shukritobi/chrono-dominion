name: Coalition Lynx Four-Phase Electromagnetic Blender Preview

# PREVIEW ONLY. Reuse verified source; never publish approved game art.
on:
  workflow_dispatch:
  push:
    branches:
      - asset-preview/coalition-lynx-temporal-attack-20261028
    paths:
      - .github/workflows/coalition-lynx-temporal-attack-review.yml
      - tools/blender/preview_coalition_lynx_temporal_attack.py
      - tools/blender/qa_coalition_lynx_temporal_attack.py

permissions:
  contents: read
  actions: read

concurrency:
  group: chrono-coalition-lynx-temporal-attack-review
  cancel-in-progress: true

jobs:
  temporal-review:
    runs-on: ubuntu-24.04
    timeout-minutes: 85
    steps:
      - name: Checkout preview-only branch
        uses: actions/checkout@v4

      - name: Compile new Blender and pixel QA scripts
        run: |
          set -euo pipefail
          python -m py_compile tools/blender/preview_coalition_lynx_temporal_attack.py tools/blender/qa_coalition_lynx_temporal_attack.py
          python -m pip install --quiet Pillow

      - name: Download validated Lynx Blender source and original PNGs
        uses: actions/download-artifact@v4
        with:
          name: chrono-coalition-lynx-battle-tank-32-preview
          run-id: 40494276431
          github-token: ${{ github.token }}
          path: archived-lynx-source

      - name: Record original atlas SHA-256 and validate baseline files
        run: |
          set -euo pipefail
          test -s archived-lynx-source/coalition-lynx-battle-tank.blend
          test -s archived-lynx-source/coalition-lynx-battle-tank-32-preview.png
          test -s archived-lynx-source/frames/idle/00.png
          test -s archived-lynx-source/frames/attack/31.png
          sha256sum archived-lynx-source/coalition-lynx-battle-tank-32-preview.png > "$RUNNER_TEMP/lynx-original-atlas.sha256"

      - name: Cache official Blender 4.2.23 LTS
        uses: actions/cache@v4
        with:
          path: ~/.cache/chrono-blender/blender-4.2.23-linux-x64.tar.xz
          key: chrono-blender-4.2.23-linux-x64-official

      - name: Install checksum-verified Blender
        shell: bash
        run: |
          set -euo pipefail
          version=4.2.23
          name="blender-$version-linux-x64.tar.xz"
          base="https://download.blender.org/release/Blender4.2"
          mkdir -p "$HOME/.cache/chrono-blender" "$RUNNER_TEMP/chrono-blender"
          archive="$HOME/.cache/chrono-blender/$name"
          if [[ ! -s "$archive" ]]; then
            curl --fail --location --retry 3 --retry-delay 4 \
              --connect-timeout 25 --max-time 480 "$base/$name" --output "$archive"
          fi
          curl --fail --location --retry 3 --connect-timeout 20 --max-time 90 \
            "$base/blender-$version.sha256" --output "$RUNNER_TEMP/blender.sha256"
          grep -F "$name" "$RUNNER_TEMP/blender.sha256" | head -1 | \
            (cd "$HOME/.cache/chrono-blender" && sha256sum --check)
          tar -xJf "$archive" -C "$RUNNER_TEMP/chrono-blender" --strip-components=1
          echo "$RUNNER_TEMP/chrono-blender" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/chrono-blender/blender" --version | head -2

      - name: Render only 128 NEW Coalition Lynx temporal attack sprites
        shell: bash
        run: |
          set -euo pipefail
          blender --background --threads 4 \
            archived-lynx-source/coalition-lynx-battle-tank.blend \
            --python-exit-code 1 \
            --python tools/blender/preview_coalition_lynx_temporal_attack.py -- \
            --output generated/coalition-lynx-temporal-attack

      - name: Reopen editable Blender source and inspect original/new geometry
        shell: bash
        run: |
          set -euo pipefail
          blender --background --threads 2 \
            generated/coalition-lynx-temporal-attack/coalition-lynx-temporal-attack.blend \
            --python-exit-code 1 --python-expr \
            'import bpy; t=[o for o in bpy.data.objects if o.get("lynx_temporal_only")]; w=[o for o in bpy.data.objects if o.get("wreckage_only")]; wheels=[o for o in bpy.data.objects if o.name.startswith("Independent roadwheel pivot")]; cleats=[o for o in bpy.data.objects if o.name.startswith("Independent animated tread cleat")]; arcs=[o for o in t if "discharge ribbon" in o.name]; assert len(t)==12,(len(t),[o.name for o in t]); assert len(w)==8,len(w); assert len(wheels)==12 and len(cleats)==22; assert len(arcs)==4 and all(len(o.data.vertices)==10 and len(o.data.polygons)==4 for o in arcs); assert all(o.type=="MESH" and o.hide_render for o in t+w); print("PASS REOPEN: 12 TEMPORAL MESHES INCLUDING 4 REAL JAGGED RIBBONS, 8 WRECKAGE, 12 WHEELS, 22 CLEATS")'

      - name: Verify all actual 160px and 80px PNGs and archived atlas SHA
        shell: bash
        run: |
          set -euo pipefail
          python tools/blender/qa_coalition_lynx_temporal_attack.py \
            --stage generated/coalition-lynx-temporal-attack \
            --baseline archived-lynx-source
          sha256sum --check "$RUNNER_TEMP/lynx-original-atlas.sha256"
          test -s generated/coalition-lynx-temporal-attack/coalition-lynx-temporal-attack-contact-160.png
          test -s generated/coalition-lynx-temporal-attack/coalition-lynx-temporal-attack-contact-80.png
          test -s generated/coalition-lynx-temporal-attack/pixel-qa.json

      - name: Upload preview-only editable source, 128 sprites and visual QA
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: chrono-coalition-lynx-temporal-attack-preview
          path: generated/coalition-lynx-temporal-attack/
          if-no-files-found: warn
          retention-days: 30
