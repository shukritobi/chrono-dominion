name: Psionic Gravitic Four-Phase Attack Blender Preview
on:
  workflow_dispatch:
  push:
    branches:
      - asset-preview/psionic-gravitic-temporal-attack-20261027
    paths:
      - .github/workflows/psionic-gravitic-temporal-attack-review.yml
      - tools/blender/preview_psionic_gravitic_attack_sequence.py
      - tools/blender/qa_psionic_gravitic_attack_sequence.py
permissions:
  contents: read
  actions: read
concurrency:
  group: chrono-psionic-gravitic-temporal-attack-review
  cancel-in-progress: true
jobs:
  temporal-review:
    runs-on: ubuntu-24.04
    timeout-minutes: 85
    steps:
      - name: Checkout preview-only branch
        uses: actions/checkout@v4
      - name: Compile Blender and QA scripts
        run: |
          set -euo pipefail
          python -m py_compile tools/blender/preview_psionic_gravitic_attack_sequence.py tools/blender/qa_psionic_gravitic_attack_sequence.py
          python -m pip install --quiet Pillow
      - name: Download validated Blender source without rerendering
        uses: actions/download-artifact@v4
        with:
          name: chrono-psionic-gravitic-manipulator-32-preview
          run-id: 40478892855
          github-token: ${{ github.token }}
          path: archived-gravitic-source
      - name: Preserve archived atlas checksum
        run: |
          set -euo pipefail
          test -s archived-gravitic-source/psionic-gravitic-manipulator.blend
          test -s archived-gravitic-source/psionic-gravitic-manipulator-32-preview.png
          test -s archived-gravitic-source/frames/idle/00.png
          test -s archived-gravitic-source/frames/attack/31.png
          sha256sum archived-gravitic-source/psionic-gravitic-manipulator-32-preview.png > "$RUNNER_TEMP/original-atlas.sha256"
      - name: Cache Blender 4.2.23 LTS
        uses: actions/cache@v4
        with:
          path: ~/.cache/chrono-blender/blender-4.2.23-linux-x64.tar.xz
          key: chrono-blender-4.2.23-linux-x64-official
      - name: Install checksum-verified Blender
        shell: bash
        run: |
          set -euo pipefail
          version=4.2.23
          name="blender-$version-linux-x64.tar.xz"
          base="https://download.blender.org/release/Blender4.2"
          mkdir -p "$HOME/.cache/chrono-blender" "$RUNNER_TEMP/chrono-blender"
          archive="$HOME/.cache/chrono-blender/$name"
          if [[ ! -s "$archive" ]]; then
            curl --fail --location --retry 3 --retry-delay 4 \
              --connect-timeout 25 --max-time 480 "$base/$name" --output "$archive"
          fi
          curl --fail --location --retry 3 --connect-timeout 20 --max-time 90 \
            "$base/blender-$version.sha256" --output "$RUNNER_TEMP/blender.sha256"
          grep -F "$name" "$RUNNER_TEMP/blender.sha256" | head -1 | \
            (cd "$HOME/.cache/chrono-blender" && sha256sum --check)
          tar -xJf "$archive" -C "$RUNNER_TEMP/chrono-blender" --strip-components=1
          echo "$RUNNER_TEMP/chrono-blender" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/chrono-blender/blender" --version | head -2
      - name: Render 128 new attack frames only
        shell: bash
        run: |
          set -euo pipefail
          blender --background --threads 4 \
            archived-gravitic-source/psionic-gravitic-manipulator.blend \
            --python-exit-code 1 \
            --python tools/blender/preview_psionic_gravitic_attack_sequence.py -- \
            --output generated/psionic-gravitic-temporal-attack
      - name: Reopen new editable source and verify seven temporal elements
        shell: bash
        run: |
          set -euo pipefail
          blender --background --threads 2 \
            generated/psionic-gravitic-temporal-attack/psionic-gravitic-temporal-attack.blend \
            --python-exit-code 1 --python-expr \
            'import bpy; t=[o for o in bpy.data.objects if o.get("temporal_only")]; w=[o for o in bpy.data.objects if o.get("wreckage_only")]; assert len(t)==7,(len(t),[o.name for o in t]); assert len(w)==8,len(w); assert all(o.hide_render for o in t+w); assert len([o for o in t if o.type=="MESH"])==3; assert len([o for o in t if o.type=="CURVE"])==4; print("PASS REOPEN: 3 EDITABLE HOOPS, 4 CURVED FILAMENTS, 8 ORIGINAL WRECK MESHES")'
      - name: Validate 160px and 80px PNGs against archived source
        shell: bash
        run: |
          set -euo pipefail
          python tools/blender/qa_psionic_gravitic_attack_sequence.py \
            --stage generated/psionic-gravitic-temporal-attack \
            --baseline archived-gravitic-source
          sha256sum --check "$RUNNER_TEMP/original-atlas.sha256"
          test -s generated/psionic-gravitic-temporal-attack/psionic-gravitic-temporal-attack-contact-80.png
          test -s generated/psionic-gravitic-temporal-attack/psionic-gravitic-temporal-attack-contact-160.png
          test -s generated/psionic-gravitic-temporal-attack/pixel-qa.json
      - name: Upload preview-only new attack phases
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: chrono-psionic-gravitic-temporal-attack-preview
          path: generated/psionic-gravitic-temporal-attack/
          if-no-files-found: warn
          retention-days: 30
