name: Psionic Phase-Loom Hover Carrier 32-Facing Blender Preview

# Isolated original-art review; never publish game textures or manifests.
on:
  workflow_dispatch:
  push:
    branches:
      - asset-preview/psionic-phase-loom-carrier-32-20261027
    paths:
      - .github/workflows/psionic-phase-loom-carrier-32-review.yml
      - tools/blender/preview_psionic_phase_loom_carrier_32.py
      - tools/blender/qa_psionic_phase_loom_carrier_32.py

permissions:
  contents: read

concurrency:
  group: chrono-psionic-phase-loom-carrier-32-review
  cancel-in-progress: true

jobs:
  render-review:
    runs-on: ubuntu-24.04
    timeout-minutes: 85
    steps:
      - name: Checkout original preview branch
        uses: actions/checkout@v4

      - name: Validate scripts and install Pillow
        run: |
          set -euo pipefail
          python -m py_compile tools/blender/preview_coalition_carrier_32.py tools/blender/preview_psionic_phase_loom_carrier_32.py tools/blender/qa_psionic_phase_loom_carrier_32.py
          python -m pip install --quiet Pillow

      - name: Cache official Blender 4.2.23 LTS
        uses: actions/cache@v4
        with:
          path: ~/.cache/chrono-blender/blender-4.2.23-linux-x64.tar.xz
          key: chrono-blender-4.2.23-linux-x64-official

      - name: Install checksum-verified Blender
        shell: bash
        run: |
          set -euo pipefail
          version=4.2.23
          name="blender-${version}-linux-x64.tar.xz"
          base="https://download.blender.org/release/Blender4.2"
          mkdir -p "$HOME/.cache/chrono-blender" "$RUNNER_TEMP/chrono-blender"
          archive="$HOME/.cache/chrono-blender/$name"
          if [[ ! -s "$archive" ]]; then
            curl --fail --location --retry 3 --retry-delay 4 \
              --connect-timeout 25 --max-time 480 "$base/$name" --output "$archive"
          fi
          curl --fail --location --retry 3 --connect-timeout 20 --max-time 90 \
            "$base/blender-${version}.sha256" --output "$RUNNER_TEMP/blender.sha256"
          grep -F "$name" "$RUNNER_TEMP/blender.sha256" | head -1 | \
            (cd "$HOME/.cache/chrono-blender" && sha256sum --check)
          tar -xJf "$archive" -C "$RUNNER_TEMP/chrono-blender" --strip-components=1
          echo "$RUNNER_TEMP/chrono-blender" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/chrono-blender/blender" --version | head -2

      - name: Render only new Psionic Phase-Loom carrier
        shell: bash
        run: |
          set -euo pipefail
          blender --background --threads 4 --python-exit-code 1 \
            --python tools/blender/preview_psionic_phase_loom_carrier_32.py -- \
            --output generated/psionic-phase-loom-carrier-32

      - name: Reopen editable source and verify separate hidden wreckage
        shell: bash
        run: |
          set -euo pipefail
          blender --background --threads 2 \
            generated/psionic-phase-loom-carrier-32/psionic-phase-loom-hover-carrier.blend \
            --python-exit-code 1 --python-expr \
            'import bpy; wreck=[o for o in bpy.data.objects if o.type=="MESH" and o.get("wreckage_only")]; assert len(wreck)==7,(len(wreck),[o.name for o in wreck]); assert all(o.hide_render for o in wreck); names=[o.name.lower() for o in bpy.data.objects]; assert sum("independent forward phase horn" in n for n in names)==2; assert any("suspended central phase spindle" in n for n in names); assert any("levitation ring" in n for n in names); print("PASS REOPEN: 7 HIDDEN EDITABLE WRECKAGE MESHES, TWIN HORNS AND SPINDLE")'

      - name: Inspect 128 real PNGs at 160px and 80px
        shell: bash
        run: |
          set -euo pipefail
          python tools/blender/qa_psionic_phase_loom_carrier_32.py --stage generated/psionic-phase-loom-carrier-32
          test -s generated/psionic-phase-loom-carrier-32/psionic-phase-loom-contact-80.png
          test -s generated/psionic-phase-loom-carrier-32/psionic-phase-loom-contact-160.png
          test -s generated/psionic-phase-loom-carrier-32/pixel-qa.json

      - name: Upload editable model, sprites and quantitative preview QA
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: chrono-psionic-phase-loom-carrier-32-facing-preview
          path: generated/psionic-phase-loom-carrier-32/
          if-no-files-found: warn
          retention-days: 30
