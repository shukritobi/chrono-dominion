name: Federation Bull Four-Phase Electrothermal Blender Preview

# PREVIEW ONLY. Reuse verified source, never replace approved game artwork.
on:
  workflow_dispatch:
  push:
    branches:
      - asset-preview/federation-bull-temporal-attack-20261027
    paths:
      - .github/workflows/federation-bull-temporal-attack-review.yml
      - tools/blender/preview_federation_bull_temporal_attack.py
      - tools/blender/qa_federation_bull_temporal_attack.py

permissions:
  contents: read
  actions: read

concurrency:
  group: chrono-federation-bull-temporal-attack-review
  cancel-in-progress: true

jobs:
  temporal-review:
    runs-on: ubuntu-24.04
    timeout-minutes: 85
    steps:
      - name: Checkout preview-only branch
        uses: actions/checkout@v4

      - name: Compile original Blender and image QA scripts
        run: |
          set -euo pipefail
          python -m py_compile tools/blender/preview_federation_bull_temporal_attack.py tools/blender/qa_federation_bull_temporal_attack.py
          python -m pip install --quiet Pillow

      - name: Download already validated Federation Bull Blender source
        uses: actions/download-artifact@v4
        with:
          name: chrono-federation-bull-heavy-tank-32-preview
          run-id: 40501761698
          github-token: ${{ github.token }}
          path: archived-bull-source

      - name: Verify original model and baseline atlas checksum
        run: |
          set -euo pipefail
          test -s archived-bull-source/federation-bull-heavy-tank.blend
          test -s archived-bull-source/federation-bull-battle-tank-32-preview.png
          test -s archived-bull-source/frames/idle/00.png
          test -s archived-bull-source/frames/attack/31.png
          sha256sum archived-bull-source/federation-bull-battle-tank-32-preview.png > "$RUNNER_TEMP/bull-original-atlas.sha256"

      - name: Cache official Blender 4.2.23 LTS
        uses: actions/cache@v4
        with:
          path: ~/.cache/chrono-blender/blender-4.2.23-linux-x64.tar.xz
          key: chrono-blender-4.2.23-linux-x64-official

      - name: Install checksum-verified Blender
        shell: bash
        run: |
          set -euo pipefail
          version=4.2.23
          name="blender-$version-linux-x64.tar.xz"
          base="https://download.blender.org/release/Blender4.2"
          mkdir -p "$HOME/.cache/chrono-blender" "$RUNNER_TEMP/chrono-blender"
          archive="$HOME/.cache/chrono-blender/$name"
          if [[ ! -s "$archive" ]]; then
            curl --fail --location --retry 3 --retry-delay 4 \
              --connect-timeout 25 --max-time 480 "$base/$name" --output "$archive"
          fi
          curl --fail --location --retry 3 --connect-timeout 20 --max-time 90 \
            "$base/blender-$version.sha256" --output "$RUNNER_TEMP/blender.sha256"
          grep -F "$name" "$RUNNER_TEMP/blender.sha256" | head -1 | \
            (cd "$HOME/.cache/chrono-blender" && sha256sum --check)
          tar -xJf "$archive" -C "$RUNNER_TEMP/chrono-blender" --strip-components=1
          echo "$RUNNER_TEMP/chrono-blender" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/chrono-blender/blender" --version | head -2

      - name: Render only 128 NEW Federation Bull attack phases
        shell: bash
        run: |
          set -euo pipefail
          blender --background --threads 4 \
            archived-bull-source/federation-bull-heavy-tank.blend \
            --python-exit-code 1 \
            --python tools/blender/preview_federation_bull_temporal_attack.py -- \
            --output generated/federation-bull-temporal-attack

      - name: Reopen editable Blender source and verify original geometry
        shell: bash
        run: |
          set -euo pipefail
          blender --background --threads 2 \
            generated/federation-bull-temporal-attack/federation-bull-temporal-attack.blend \
            --python-exit-code 1 --python-expr \
            'import bpy; t=[o for o in bpy.data.objects if o.get("bull_temporal_only")]; w=[o for o in bpy.data.objects if o.get("wreckage_only")]; assert len(t)==12,(len(t),[o.name for o in t]); assert len(w)==8,len(w); assert all(o.type=="MESH" and o.hide_render for o in t+w); assert len([o for o in bpy.data.objects if o.name.startswith("Bull independent roadwheel pivot")])==14; print("PASS REOPEN: 12 EDITABLE TEMPORAL MESHES, 8 HIDDEN WRECKAGE, 14 ORIGINAL ROADWHEELS")'

      - name: Inspect actual 160px and 80px PNGs and verify original atlas
        shell: bash
        run: |
          set -euo pipefail
          python tools/blender/qa_federation_bull_temporal_attack.py \
            --stage generated/federation-bull-temporal-attack \
            --baseline archived-bull-source
          sha256sum --check "$RUNNER_TEMP/bull-original-atlas.sha256"
          test -s generated/federation-bull-temporal-attack/federation-bull-temporal-attack-contact-160.png
          test -s generated/federation-bull-temporal-attack/federation-bull-temporal-attack-contact-80.png
          test -s generated/federation-bull-temporal-attack/pixel-qa.json

      - name: Upload preview-only editable source, sprites and visual QA
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: chrono-federation-bull-temporal-attack-preview
          path: generated/federation-bull-temporal-attack/
          if-no-files-found: warn
          retention-days: 30
