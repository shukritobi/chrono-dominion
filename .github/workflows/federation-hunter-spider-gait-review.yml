name: Federation Hunter Spider Four-Beat Gait Blender Preview

# PREVIEW ONLY. Never publish, overwrite, or rerender validated game art.
on:
  workflow_dispatch:
  push:
    branches:
      - asset-preview/federation-hunter-spider-gait-20261028
    paths:
      - .github/workflows/federation-hunter-spider-gait-review.yml
      - tools/blender/preview_federation_hunter_spider_gait.py
      - tools/blender/qa_federation_hunter_spider_gait.py

permissions:
  contents: read
  actions: read

concurrency:
  group: chrono-federation-hunter-spider-four-beat-gait
  cancel-in-progress: true

jobs:
  gait-review:
    runs-on: ubuntu-24.04
    timeout-minutes: 85
    steps:
      - name: Checkout isolated preview-only branch
        uses: actions/checkout@v4

      - name: Compile Blender modeling and actual PNG QA scripts
        run: |
          set -euo pipefail
          python -m py_compile tools/blender/preview_federation_hunter_spider_gait.py tools/blender/qa_federation_hunter_spider_gait.py
          python -m pip install --quiet Pillow

      - name: Reuse validated Hunter Spider editable source and original PNGs
        uses: actions/download-artifact@v4
        with:
          name: chrono-federation-hunter-spider-drone-32-preview
          run-id: 40556753530
          github-token: ${{ github.token }}
          path: archived-spider-source

      - name: Assert baseline original atlas has not changed
        run: |
          set -euo pipefail
          test -s archived-spider-source/federation-hunter-spider-drone.blend
          test -s archived-spider-source/federation-hunter-spider-32-preview.png
          test -s archived-spider-source/frames/idle/00.png
          test -s archived-spider-source/frames/move/31.png
          echo '0be6b3eb5149dd022e3d904e951fc63e9c8314aff1e084dde451877b3ebe7836  archived-spider-source/federation-hunter-spider-32-preview.png' | sha256sum --check
          sha256sum archived-spider-source/federation-hunter-spider-32-preview.png > "$RUNNER_TEMP/spider-original-atlas.sha256"

      - name: Cache official Blender 4.2.23 LTS
        uses: actions/cache@v4
        with:
          path: ~/.cache/chrono-blender/blender-4.2.23-linux-x64.tar.xz
          key: chrono-blender-4.2.23-linux-x64-official

      - name: Install checksum-verified Blender
        shell: bash
        run: |
          set -euo pipefail
          version=4.2.23
          name="blender-$version-linux-x64.tar.xz"
          base="https://download.blender.org/release/Blender4.2"
          mkdir -p "$HOME/.cache/chrono-blender" "$RUNNER_TEMP/chrono-blender"
          archive="$HOME/.cache/chrono-blender/$name"
          if [[ ! -s "$archive" ]]; then
            curl --fail --location --retry 3 --retry-delay 4 \
              --connect-timeout 25 --max-time 480 "$base/$name" --output "$archive"
          fi
          curl --fail --location --retry 3 --connect-timeout 20 --max-time 90 \
            "$base/blender-$version.sha256" --output "$RUNNER_TEMP/blender.sha256"
          grep -F "$name" "$RUNNER_TEMP/blender.sha256" | head -1 | \
            (cd "$HOME/.cache/chrono-blender" && sha256sum --check)
          tar -xJf "$archive" -C "$RUNNER_TEMP/chrono-blender" --strip-components=1
          echo "$RUNNER_TEMP/chrono-blender" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/chrono-blender/blender" --version | head -2

      - name: Render only 128 NEW four-beat spider movement frames
        shell: bash
        run: |
          set -euo pipefail
          blender --background --threads 4 \
            archived-spider-source/federation-hunter-spider-drone.blend \
            --python-exit-code 1 \
            --python tools/blender/preview_federation_hunter_spider_gait.py -- \
            --output generated/federation-hunter-spider-gait

      - name: Reopen saved editable Blender source and inspect actual geometry
        shell: bash
        run: |
          set -euo pipefail
          blender --background --threads 2 \
            generated/federation-hunter-spider-gait/federation-hunter-spider-four-beat-gait.blend \
            --python-exit-code 1 --python-expr \
            'import bpy; t=[o for o in bpy.data.objects if o.get("spider_gait_only")]; w=[o for o in bpy.data.objects if o.get("wreckage_only")]; hips=[o for o in bpy.data.objects if o.type=="EMPTY" and o.name.startswith("Independent spider leg ")]; upper=[o for o in bpy.data.objects if o.name.startswith("Leg ") and "upper tapered armor" in o.name]; lower=[o for o in bpy.data.objects if o.name.startswith("Leg ") and "lower exposed piston" in o.name]; assert len(t)==8 and len(w)==10 and len(hips)==8,(len(t),len(w),len(hips)); assert len(upper)==len(lower)==8; assert all(o.type=="MESH" and o.hide_render for o in t+w); assert all(len(o.data.vertices)==6 and len(o.data.polygons)==8 for o in t); print("PASS REOPEN: 8 ORIGINAL FACETED HEEL ROCKERS, 8 HIP RIGS, 16 LEG STRUTS, 10 HIDDEN WRECKS")'

      - name: Validate all 160px and 80px PNGs against immutable archived atlas
        shell: bash
        run: |
          set -euo pipefail
          python tools/blender/qa_federation_hunter_spider_gait.py \
            --stage generated/federation-hunter-spider-gait \
            --baseline archived-spider-source
          sha256sum --check "$RUNNER_TEMP/spider-original-atlas.sha256"
          test -s generated/federation-hunter-spider-gait/federation-hunter-spider-gait-contact-160.png
          test -s generated/federation-hunter-spider-gait/federation-hunter-spider-gait-contact-80.png
          test -s generated/federation-hunter-spider-gait/pixel-qa.json

      - name: Upload preview-only editable source, sprites, contact sheets and QA
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: chrono-federation-hunter-spider-four-beat-gait-preview
          path: generated/federation-hunter-spider-gait/
          if-no-files-found: warn
          retention-days: 30
