name: Beam Defense Targeted Wreckage Visual Repair

# Reuses the validated original five-frame atlases and Blender sources.
# Never publishes any live game art or manifest.
on:
  workflow_dispatch:
  push:
    branches:
      - asset-preview/beam-extra-states-20261027
    paths:
      - ".github/workflows/beam-wreckage-visual-repair.yml"
      - "tools/blender/preview_beam_extended_states.py"

permissions:
  contents: read
  actions: read

concurrency:
  group: chrono-beam-focused-repair
  cancel-in-progress: true

jobs:
  render-review:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout isolated preview branch
        uses: actions/checkout@v4

      - name: Install Pillow and compile repaired Blender scripts
        run: |
          set -euo pipefail
          python -m pip install --quiet Pillow
          python -m py_compile tools/blender/preview_beam_extended_states.py tools/blender/qa_beam_extended_states.py

      - name: Cache official Blender 4.2.23 LTS
        uses: actions/cache@v4
        with:
          path: ~/.cache/chrono-blender/blender-4.2.23-linux-x64.tar.xz
          key: chrono-blender-4.2.23-linux-x64-official

      - name: Install checksum-verified Blender
        shell: bash
        run: |
          set -euo pipefail
          version=4.2.23
          name="blender-${version}-linux-x64.tar.xz"
          base="https://download.blender.org/release/Blender4.2"
          mkdir -p "$HOME/.cache/chrono-blender" "$RUNNER_TEMP/chrono-blender"
          archive="$HOME/.cache/chrono-blender/$name"
          if [[ ! -s "$archive" ]]; then
            curl --fail --location --retry 3 --retry-delay 4 \
              --connect-timeout 25 --max-time 480 "$base/$name" --output "$archive"
          fi
          curl --fail --location --retry 3 --connect-timeout 20 --max-time 90 \
            "$base/blender-${version}.sha256" --output "$RUNNER_TEMP/blender.sha256"
          grep -F "$name" "$RUNNER_TEMP/blender.sha256" | head -1 | \
            (cd "$HOME/.cache/chrono-blender" && sha256sum --check)
          tar -xJf "$archive" -C "$RUNNER_TEMP/chrono-blender" --strip-components=1
          echo "$RUNNER_TEMP/chrono-blender" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/chrono-blender/blender" --version | head -2

      - name: Reuse prior passed beam sources and five-frame atlases
        uses: actions/download-artifact@v4
        with:
          name: chrono-three-faction-beam-extra-state-pilot
          run-id: 40436425113
          github-token: ${{ github.token }}
          path: generated/beam-extra-pilot

      - name: Verify archived original sprites before repair
        shell: bash
        run: |
          set -euo pipefail
          stage=generated/beam-extra-pilot
          test -s "$stage/packed/coalition-beam.png"
          test -s "$stage/packed/federation-beam.png"
          test -s "$stage/packed/psionic-beam.png"
          for faction in coalition federation psionic; do
            test -s "$stage/sources/$faction-beam.blend"
          done
          sha256sum --check "$stage/original-atlases.sha256"

      - name: Rerender only previously occluded Federation and Psionic wreckage
        shell: bash
        run: |
          set -euo pipefail
          stage=generated/beam-extra-pilot
          for faction in federation psionic; do
            blender --background --threads 4 \
              "$stage/sources/$faction-beam.blend" \
              --python-exit-code 1 \
              --python tools/blender/preview_beam_extended_states.py -- \
              --faction "$faction" --output "$stage/extra/$faction"
          done

      - name: Reopen only two corrected editable Blender sources
        shell: bash
        run: |
          set -euo pipefail
          stage=generated/beam-extra-pilot
          for faction in federation psionic; do
            blender --background --threads 2 \
              "$stage/extra/$faction/$faction-beam-extended-states.blend" \
              --python-exit-code 1 --python-expr \
              'import bpy; a=[o for o in bpy.data.objects if o.type=="MESH" and (o.name.startswith("Critical-only") or o.name.startswith("Destroyed-only"))]; assert len(a)==9,(len(a),[o.name for o in a]); assert all(o.hide_render for o in a); print("PASS: nine hidden editable beam wreckage meshes")'
          done

      - name: Recompute 80px and 160px QA for complete consolidated review
        shell: bash
        run: |
          set -euo pipefail
          stage=generated/beam-extra-pilot
          python tools/blender/qa_beam_extended_states.py --stage "$stage"
          sha256sum --check "$stage/original-atlases.sha256"

      - name: Upload consolidated preview-only sources and actual PNGs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: chrono-three-faction-beam-repaired-preview
          path: generated/beam-extra-pilot/
          if-no-files-found: warn
          retention-days: 30
