name: Check and deploy browser prototype
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  workflow_run:
    workflows: ["Bake original Blender art"]
    types: [completed]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: ${{ github.event_name == 'pull_request' && format('verify-pr-{0}', github.event.pull_request.number) || 'github-pages' }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check JavaScript syntax
        run: |
          node --check game.js
          node tests/smoke.test.mjs
          node --check art/vehicle-renderer.js
          node --check art/animated-entities.js
          node --check art/baked-atlas-loader.js
          node tests/vehicle-art.test.mjs
          node tests/animated-art-v221.test.mjs
          node tests/baked-art-v223.test.mjs
          node tests/combat-economy.test.mjs
          node tests/save-formation.test.mjs
          node tests/tactics.test.mjs
          node tests/abilities.test.mjs
          node tests/skirmish-v08.test.mjs
          node tests/battle-report-v09.test.mjs
          node tests/map-forge-v100.test.mjs
          node tests/map-editor-ui.test.mjs
          node tests/map-library-v11.test.mjs
          node tests/gameplay-v12.test.mjs
          node tests/tactics-v13.test.mjs
          node tests/traffic-v14.test.mjs
          node tests/navigation-v15.test.mjs
          node tests/right-of-way-v16.test.mjs
          node tests/lanes-v18.test.mjs
          node tests/platoons-v19.test.mjs
          node tests/multi-platoon-v20.test.mjs
          node tests/targeting-v21.test.mjs
          node tests/match-lifecycle-v22.test.mjs
          node tests/ore-reachability-v22.test.mjs
          node tests/recon-v23.test.mjs
          node tests/survey-v24.test.mjs
          node tests/intelligence-v25.test.mjs
          node tests/events-v26.test.mjs
          node tests/frontiers-v27.test.mjs
          node tests/touch-v28.test.mjs
          node tests/mobile-layout-v29.test.mjs
          node tests/mobile-cancel-v29.test.mjs
          node tests/scout-safety-v210.test.mjs
          node tests/scout-routes-v211.test.mjs
          node tests/scout-evasion-v212.test.mjs
          node tests/scout-detours-v213.test.mjs
          node tests/scout-progress-v214.test.mjs
          node tests/platoon-attrition-v215.test.mjs
          node tests/veterancy-v216.test.mjs
          node tests/objective-ranking-v217.test.mjs
          node tests/assault-pathing-v218.test.mjs
          node tests/siege-focus-v219.test.mjs
          node tests/rally-recovery-v220.test.mjs
          node tools/simulate-matches.mjs --duration=240 --out=balance-report.json
          node tools/simulate-matches.mjs --progression --out=progression-report.json
          node tools/check-ai-economy-regression.mjs progression-report.json
          node tools/simulate-air-engagements.mjs --out=air-report.json
          node tests/production-v17.test.mjs
          node --check audio/sfx.js
          node --check audio/voices.js
          python3 tools/audio/build_builtin.py --check
          node tests/builtin-audio-v224.test.mjs
          node tests/original-voice-library-v222.test.mjs
          node --check tools/audio/export-register.mjs
          node tests/audio-soundscape-v221.test.mjs
          node tests/expanse-camera-v222.test.mjs
          node tests/air-formations-v223.test.mjs
          node tests/ai-air-wing-v225.test.mjs
          node tests/aircraft-rearm-v226.test.mjs
          node tests/air-defense-v227.test.mjs
          node tests/air-return-safety-v228.test.mjs
          node tests/aircraft-repair-v229.test.mjs
          node tests/ai-air-withdrawal-v230.test.mjs
          node tests/airfield-outage-v231.test.mjs
          node tests/anti-air-battery-v232.test.mjs
          node tests/airfield-choice-v233.test.mjs
          node tests/target-acquisition-v234.test.mjs
          node tests/xl-pathfinding-v235.test.mjs
          node tests/path-query-cache-v236.test.mjs
          node tests/navigation-footprint-v237.test.mjs
          node tests/frame-collision-v238.test.mjs
          node tests/sensor-index-v239.test.mjs
          node tests/aircraft-service-visual-v240.test.mjs
          node tests/fog-visibility-v241.test.mjs
          node tests/ai-skyguard-scaling-v242.test.mjs
          node tests/ai-construction-frontier.test.mjs
          node tests/ai-aviation-investment.test.mjs
          node tests/ai-aircraft-funding.test.mjs
          node tests/ai-ore-economy.test.mjs
          node tests/ai-aviation-diagnostics.test.mjs
          node tests/ai-harvester-telemetry.test.mjs
          node tests/harvester-separation-telemetry.test.mjs
          node tests/harvester-move-telemetry.test.mjs
          node tests/ai-economy-guard.test.mjs
          node --check maps/map-core.js
          node --check maps/map-editor.js
          node tools/maps/build.mjs --check
          python3 -m py_compile tools/blender/generate_tanks.py tools/blender/pack_atlas.py tools/blender/animated_assets.py tools/blender/pack_animated.py
      - name: Archive nine-scenario balance metrics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: balance-lab-${{ github.run_number }}
          path: |
            balance-report.json
            progression-report.json
            air-report.json
          if-no-files-found: warn
          retention-days: 21
      - name: Verify required files
        run: |
          test -f index.html
          test -f style.css
          test -f game.js
          test -f art/vehicle-renderer.js
          test -f art/animated-entities.js
          test -f art/baked-atlas-loader.js
          test -f tools/blender/animated_assets.py
          test -f tools/blender/pack_animated.py
          test -f tests/baked-art-v223.test.mjs
          test -f tests/animated-art-v221.test.mjs
          test -f art/pilot/coalition-power.svg
          test -f art/pilot/federation-power.svg
          test -f art/pilot/psionic-power.svg
          test -f art/pilot/coalition-infantry.svg
          test -f art/pilot/federation-infantry.svg
          test -f art/pilot/psionic-infantry.svg
          test -f art/pilot/coalition-turret.svg
          test -f art/pilot/federation-turret.svg
          test -f art/pilot/psionic-turret.svg
          test -f art/pilot/coalition-specialist.svg
          test -f art/pilot/federation-specialist.svg
          test -f art/pilot/psionic-specialist.svg
          test -f art/pilot/coalition-recon.svg
          test -f art/pilot/federation-recon.svg
          test -f art/pilot/psionic-recon.svg
          test -f art/manifest.json
          test -f art/rendered/manifest.json
          test -f maps/verdant.json
          test -f maps/desert.json
          test -f maps/snow.json
          test -f maps/expanse.json
          test -f maps/catalog.js
          test -f maps/map-core.js
          test -f maps/map-editor.js
          test -f map-editor.html
          test -f audio/sfx.js
          test -f tools/maps/build.mjs
          test -f tools/simulate-matches.mjs
          test -f tools/simulate-air-engagements.mjs
          test -f tests/ore-reachability-v22.test.mjs
          test -f tests/recon-v23.test.mjs
          test -f tests/survey-v24.test.mjs
          test -f tests/intelligence-v25.test.mjs
          test -f tests/events-v26.test.mjs
          test -f tests/frontiers-v27.test.mjs
          test -f tests/touch-v28.test.mjs
          test -f tests/mobile-layout-v29.test.mjs
          test -f tests/mobile-cancel-v29.test.mjs
          test -f tests/scout-safety-v210.test.mjs
          test -f tests/scout-routes-v211.test.mjs
          test -f tests/scout-evasion-v212.test.mjs
          test -f tests/scout-detours-v213.test.mjs
          test -f tests/scout-progress-v214.test.mjs
          test -f tests/platoon-attrition-v215.test.mjs
          test -f tests/veterancy-v216.test.mjs
          test -f tests/objective-ranking-v217.test.mjs
          test -f tests/assault-pathing-v218.test.mjs
          test -f tests/siege-focus-v219.test.mjs
          test -f tests/rally-recovery-v220.test.mjs
          test -f tests/expanse-camera-v222.test.mjs
          test -f tests/air-formations-v223.test.mjs
          test -f tests/ai-air-wing-v225.test.mjs
          test -f tests/aircraft-rearm-v226.test.mjs
          test -f tests/air-defense-v227.test.mjs
          test -f tests/aircraft-repair-v229.test.mjs
          test -f tests/ai-air-withdrawal-v230.test.mjs
          test -f tests/airfield-outage-v231.test.mjs
          test -f tests/anti-air-battery-v232.test.mjs
          test -f tests/airfield-choice-v233.test.mjs
          test -f tests/target-acquisition-v234.test.mjs
          test -f tests/xl-pathfinding-v235.test.mjs
          test -f tests/frame-collision-v238.test.mjs
          test -f tests/sensor-index-v239.test.mjs
          test -f tests/aircraft-service-visual-v240.test.mjs
          test -f tests/fog-visibility-v241.test.mjs
          test -f tests/ai-aviation-investment.test.mjs
          test -f tests/ai-aircraft-funding.test.mjs
          test -f tests/ai-ore-economy.test.mjs
          test -f tools/blender/generate_tanks.py
          test -f tools/blender/pack_atlas.py
          test -f docs/game-design/FULL-BLUEPRINT.md
          test -f docs/asset-production/ASSET-PRODUCTION-PLAN.md
          test -f planning/AssetRegister.csv
      - name: Validate unique asset IDs
        run: |
          node - <<'NODE'
          const fs = require('node:fs');
          const lines = fs.readFileSync('planning/AssetRegister.csv', 'utf8').trim().split(/\r?\n/);
          const ids = lines.slice(1).map(l => l.split(',')[0]);
          const duplicates = ids.filter((id,i) => ids.indexOf(id) !== i);
          if (duplicates.length || ids.length !== 308) {
            console.error('Asset register validation failed', {count:ids.length,duplicates});
            process.exit(1);
          }
          console.log('Validated', ids.length, 'unique planned asset families');
          NODE

  deploy:
    needs: verify
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Bake 473 original bundled sound files
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq espeak ffmpeg
          python3 tools/audio/build_builtin.py
          test "$(find audio/builtin -type f -name '*.mp3' | wc -l)" -eq 473
          test -f audio/builtin/audio-map.json
      - name: Commit baked sounds to the repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add audio/builtin/
          if ! git diff --cached --quiet; then
            git commit -m "chore(audio): bundle 473 original MP3s for browser playback"
            # A token-authored push does not retrigger this workflow.
            git push origin "HEAD:${GITHUB_REF_NAME}" || echo "::warning::Sound files baked into this deployment, but repository binary commit needs retry"
          fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
