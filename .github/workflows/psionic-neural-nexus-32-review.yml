name: Psionic Neural Nexus Tank 32-Facing Original Blender Preview

# Isolated original geometry review. Never publish game textures/manifests.
on:
  workflow_dispatch:
  push:
    branches:
      - asset-preview/psionic-neural-nexus-32-20261029
    paths:
      - .github/workflows/psionic-neural-nexus-32-review.yml
      - tools/blender/preview_psionic_neural_nexus_32.py
      - tools/blender/qa_psionic_neural_nexus_32.py

permissions:
  contents: read

concurrency:
  group: chrono-psionic-neural-nexus-32-preview
  cancel-in-progress: true

jobs:
  render-review:
    runs-on: ubuntu-24.04
    timeout-minutes: 85
    steps:
      - name: Checkout isolated preview branch
        uses: actions/checkout@v4

      - name: Compile source and install strict image QA
        run: |
          set -euo pipefail
          python -m py_compile tools/blender/preview_coalition_carrier_32.py tools/blender/preview_psionic_neural_nexus_32.py tools/blender/qa_psionic_neural_nexus_32.py
          python -m pip install --quiet Pillow

      - name: Cache official Blender 4.2.23 LTS
        uses: actions/cache@v4
        with:
          path: ~/.cache/chrono-blender/blender-4.2.23-linux-x64.tar.xz
          key: chrono-blender-4.2.23-linux-x64-official

      - name: Install checksum-verified Blender
        shell: bash
        run: |
          set -euo pipefail
          version=4.2.23
          name="blender-$version-linux-x64.tar.xz"
          base="https://download.blender.org/release/Blender4.2"
          mkdir -p "$HOME/.cache/chrono-blender" "$RUNNER_TEMP/chrono-blender"
          archive="$HOME/.cache/chrono-blender/$name"
          if [[ ! -s "$archive" ]]; then
            curl --fail --location --retry 3 --retry-delay 4 --connect-timeout 25 --max-time 480 "$base/$name" --output "$archive"
          fi
          curl --fail --location --retry 3 --connect-timeout 20 --max-time 90 "$base/blender-$version.sha256" --output "$RUNNER_TEMP/blender.sha256"
          grep -F "$name" "$RUNNER_TEMP/blender.sha256" | head -1 | (cd "$HOME/.cache/chrono-blender" && sha256sum --check)
          tar -xJf "$archive" -C "$RUNNER_TEMP/chrono-blender" --strip-components=1
          echo "$RUNNER_TEMP/chrono-blender" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/chrono-blender/blender" --version | head -2

      - name: Render only PSI-VEH-006 original 32-facing preview
        run: |
          set -euo pipefail
          blender --background --threads 4 --python-exit-code 1 \
            --python tools/blender/preview_psionic_neural_nexus_32.py -- \
            --output generated/psionic-neural-nexus-32

      - name: Reopen editable Blender source and verify independent geometry
        run: |
          set -euo pipefail
          blender --background --threads 2 \
            generated/psionic-neural-nexus-32/psionic-neural-nexus-tank.blend \
            --python-exit-code 1 --python-expr '
          import bpy, bmesh
          objs=list(bpy.data.objects)
          meshes=[o for o in objs if o.type=="MESH"]
          hull=[o for o in meshes if o.get("custom_hull")]
          pods=[o for o in objs if "independent levitation pod pivot" in o.name.lower()]
          arches=[o for o in meshes if o.get("open_arch")]
          petals=[o for o in meshes if o.get("custom_petal")]
          hinges=[o for o in objs if "independent hinged neural petal" in o.name.lower()]
          effects=[o for o in meshes if o.get("attack_only")]
          crowns=[o for o in objs if "genuinely open neural crown" in o.name.lower()]
          wreck=[o for o in meshes if o.get("closed_fracture")]
          assert len(hull)==1 and len(hull[0].data.vertices)==20
          assert (len(pods),len(arches),len(petals),len(hinges),len(effects),len(crowns),len(wreck))==(6,18,4,4,24,1,12)
          assert all(e.hide_render and e.parent==crowns[0] for e in effects)
          assert all(o.hide_render and o.get("wreckage_only") for o in wreck)
          for o in wreck:
              bm=bmesh.new();bm.from_mesh(o.data)
              assert (len(bm.verts),len(bm.faces))==(12,8),o.name
              assert all(e.is_manifold for e in bm.edges),o.name
              bm.free()
          print("PASS REOPEN: 20-vertex manta hull, six hover pods, 18 open arch struts, four petals, 24 attached ring segments, 12 manifold wreck meshes")
          '

      - name: Check actual 160px and 80px pixels and build preview sheets
        run: |
          set -euo pipefail
          python tools/blender/qa_psionic_neural_nexus_32.py --stage generated/psionic-neural-nexus-32
          test -s generated/psionic-neural-nexus-32/pixel-qa.json
          test -s generated/psionic-neural-nexus-32/psionic-neural-nexus-contact-160.png
          test -s generated/psionic-neural-nexus-32/psionic-neural-nexus-contact-80.png

      - name: Upload editable source, frames, atlas and QA without publishing
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: chrono-psionic-neural-nexus-32-preview
          path: generated/psionic-neural-nexus-32/
          if-no-files-found: warn
          retention-days: 30
