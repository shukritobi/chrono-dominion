name: Coalition Warden Dual-Ion Four-Phase Blender Preview

# PREVIEW ONLY. Reuse verified editable source; do not publish game art.
on:
  workflow_dispatch:
  push:
    branches:
      - asset-preview/coalition-warden-temporal-attack-20261028
    paths:
      - .github/workflows/coalition-warden-temporal-attack-review.yml
      - tools/blender/preview_coalition_warden_temporal_attack.py
      - tools/blender/qa_coalition_warden_temporal_attack.py

permissions:
  contents: read
  actions: read

concurrency:
  group: chrono-coalition-warden-temporal-attack-review
  cancel-in-progress: true

jobs:
  temporal-review:
    runs-on: ubuntu-24.04
    timeout-minutes: 85
    steps:
      - name: Checkout isolated preview-only branch
        uses: actions/checkout@v4

      - name: Compile new original Blender modeling and strict pixel QA
        run: |
          set -euo pipefail
          python -m py_compile tools/blender/preview_coalition_warden_temporal_attack.py tools/blender/qa_coalition_warden_temporal_attack.py
          python -m pip install --quiet Pillow

      - name: Download existing validated Warden model and original PNGs
        uses: actions/download-artifact@v4
        with:
          name: chrono-coalition-autonomous-warden-32-preview
          run-id: 40471597359
          github-token: ${{ github.token }}
          path: archived-warden-source

      - name: Record original atlas SHA-256 without rerendering
        run: |
          set -euo pipefail
          test -s archived-warden-source/coalition-autonomous-warden-tank.blend
          test -s archived-warden-source/coalition-autonomous-warden-32-preview.png
          test -s archived-warden-source/frames/idle/00.png
          test -s archived-warden-source/frames/attack/31.png
          sha256sum archived-warden-source/coalition-autonomous-warden-32-preview.png > "$RUNNER_TEMP/warden-original-atlas.sha256"

      - name: Cache official Blender 4.2.23 LTS
        uses: actions/cache@v4
        with:
          path: ~/.cache/chrono-blender/blender-4.2.23-linux-x64.tar.xz
          key: chrono-blender-4.2.23-linux-x64-official

      - name: Install checksum-verified Blender
        shell: bash
        run: |
          set -euo pipefail
          version=4.2.23
          name="blender-$version-linux-x64.tar.xz"
          base="https://download.blender.org/release/Blender4.2"
          mkdir -p "$HOME/.cache/chrono-blender" "$RUNNER_TEMP/chrono-blender"
          archive="$HOME/.cache/chrono-blender/$name"
          if [[ ! -s "$archive" ]]; then
            curl --fail --location --retry 3 --retry-delay 4 \
              --connect-timeout 25 --max-time 480 "$base/$name" --output "$archive"
          fi
          curl --fail --location --retry 3 --connect-timeout 20 --max-time 90 \
            "$base/blender-$version.sha256" --output "$RUNNER_TEMP/blender.sha256"
          grep -F "$name" "$RUNNER_TEMP/blender.sha256" | head -1 | \
            (cd "$HOME/.cache/chrono-blender" && sha256sum --check)
          tar -xJf "$archive" -C "$RUNNER_TEMP/chrono-blender" --strip-components=1
          echo "$RUNNER_TEMP/chrono-blender" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/chrono-blender/blender" --version | head -2

      - name: Render ONLY 128 new four-phase Warden dual-ion attack frames
        shell: bash
        run: |
          set -euo pipefail
          blender --background --threads 4 \
            archived-warden-source/coalition-autonomous-warden-tank.blend \
            --python-exit-code 1 \
            --python tools/blender/preview_coalition_warden_temporal_attack.py -- \
            --output generated/coalition-warden-temporal-attack

      - name: Reopen editable source and verify real new Blender meshes
        shell: bash
        run: |
          set -euo pipefail
          blender --background --threads 2 \
            generated/coalition-warden-temporal-attack/coalition-warden-temporal-attack.blend \
            --python-exit-code 1 --python-expr \
            'import bpy; t=[o for o in bpy.data.objects if o.get("warden_temporal_only")]; w=[o for o in bpy.data.objects if o.get("wreckage_only")]; pads=[o for o in bpy.data.objects if o.name.startswith("Independently cycling track cleat")]; barrels=[o for o in bpy.data.objects if o.name.startswith("Independent ion accelerator barrel")]; ribbons=[o for o in t if "jagged ion ribbon" in o.name]; assert len(t)==16,(len(t),[o.name for o in t]); assert len(w)==8,len(w); assert len(pads)==18 and len(barrels)==2; assert len(ribbons)==4 and all(len(o.data.vertices)==10 and len(o.data.polygons)==4 for o in ribbons); assert all(o.type=="MESH" and o.hide_render for o in t+w); print("PASS REOPEN: 16 EDITABLE TEMPORAL MESHES, 4 FACETED RIBBONS, 8 WRECKS, 18 CLEATS, 2 ION BARRELS")'

      - name: Inspect all real 160px and 80px PNGs and unchanged atlas
        shell: bash
        run: |
          set -euo pipefail
          python tools/blender/qa_coalition_warden_temporal_attack.py \
            --stage generated/coalition-warden-temporal-attack \
            --baseline archived-warden-source
          sha256sum --check "$RUNNER_TEMP/warden-original-atlas.sha256"
          test -s generated/coalition-warden-temporal-attack/coalition-warden-temporal-contact-160.png
          test -s generated/coalition-warden-temporal-attack/coalition-warden-temporal-contact-80.png
          test -s generated/coalition-warden-temporal-attack/pixel-qa.json

      - name: Upload preview-only source, 128 new sprites and quantitative QA
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: chrono-coalition-warden-temporal-attack-preview
          path: generated/coalition-warden-temporal-attack/
          if-no-files-found: warn
          retention-days: 30
