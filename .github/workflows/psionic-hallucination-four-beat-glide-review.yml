name: Psionic Hallucination Four-Beat Physical Glide Blender Preview

# PREVIEW ONLY. Never publishes game art or overwrites the baseline atlas.
on:
  workflow_dispatch:
  push:
    branches:
      - asset-preview/psionic-hallucination-four-beat-glide-20261028
    paths:
      - .github/workflows/psionic-hallucination-four-beat-glide-review.yml
      - tools/blender/preview_psionic_hallucination_four_beat_glide.py
      - tools/blender/qa_psionic_hallucination_four_beat_glide.py

permissions:
  contents: read
  actions: read

concurrency:
  group: chrono-psionic-hallucination-four-beat-glide
  cancel-in-progress: true

jobs:
  temporal-review:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Checkout isolated preview branch
        uses: actions/checkout@v4

      - name: Compile original Blender model and strict PNG QA
        run: |
          set -euo pipefail
          python -m py_compile tools/blender/preview_psionic_hallucination_four_beat_glide.py tools/blender/qa_psionic_hallucination_four_beat_glide.py
          python -m pip install --quiet Pillow

      - name: Download ONLY previously validated editable Hallucination source
        uses: actions/download-artifact@v4
        with:
          name: chrono-psionic-hallucination-drone-32-preview
          run-id: 40583938655
          github-token: ${{ github.token }}
          path: archived-hallucination-source

      - name: Verify immutable baseline and record original atlas SHA-256
        run: |
          set -euo pipefail
          test -s archived-hallucination-source/psionic-hallucination-drone.blend
          test -s archived-hallucination-source/frames/idle/00.png
          test -s archived-hallucination-source/frames/attack/31.png
          test -s archived-hallucination-source/psionic-hallucination-drone-32-preview.png
          echo "59e25ecc1d6f844370ff2233636b3e61ffd2e82ce09fb92e70fbde1ecf49940d  archived-hallucination-source/psionic-hallucination-drone-32-preview.png" | sha256sum --check
          sha256sum archived-hallucination-source/psionic-hallucination-drone-32-preview.png > "$RUNNER_TEMP/hallucination-baseline.sha256"

      - name: Cache official Blender 4.2.23 LTS
        uses: actions/cache@v4
        with:
          path: ~/.cache/chrono-blender/blender-4.2.23-linux-x64.tar.xz
          key: chrono-blender-4.2.23-linux-x64-official

      - name: Install checksum-verified Blender 4.2.23
        shell: bash
        run: |
          set -euo pipefail
          version=4.2.23
          name="blender-$version-linux-x64.tar.xz"
          base="https://download.blender.org/release/Blender4.2"
          mkdir -p "$HOME/.cache/chrono-blender" "$RUNNER_TEMP/chrono-blender"
          archive="$HOME/.cache/chrono-blender/$name"
          if [[ ! -s "$archive" ]]; then
            curl --fail --location --retry 3 --retry-delay 4 \
              --connect-timeout 25 --max-time 480 "$base/$name" --output "$archive"
          fi
          curl --fail --location --retry 3 --connect-timeout 20 --max-time 90 \
            "$base/blender-$version.sha256" --output "$RUNNER_TEMP/blender.sha256"
          grep -F "$name" "$RUNNER_TEMP/blender.sha256" | head -1 | \
            (cd "$HOME/.cache/chrono-blender" && sha256sum --check)
          tar -xJf "$archive" -C "$RUNNER_TEMP/chrono-blender" --strip-components=1
          echo "$RUNNER_TEMP/chrono-blender" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/chrono-blender/blender" --version | head -2

      - name: Render ONLY 128 new four-beat physical glide frames
        shell: bash
        run: |
          set -euo pipefail
          blender --background --threads 4 \
            archived-hallucination-source/psionic-hallucination-drone.blend \
            --python-exit-code 1 \
            --python tools/blender/preview_psionic_hallucination_four_beat_glide.py -- \
            --output generated/psionic-hallucination-glide

      - name: Reopen actual editable Blender source and inspect original plus new meshes
        shell: bash
        run: |
          set -euo pipefail
          blender --background --threads 2 \
            generated/psionic-hallucination-glide/psionic-hallucination-four-beat-glide.blend \
            --python-exit-code 1 --python-expr \
            'import bpy; t=[o for o in bpy.data.objects if o.get("hallucination_glide_only")]; p=[o for o in bpy.data.objects if o.type=="EMPTY" and o.name.startswith("Independent phase petal ")]; w=[o for o in bpy.data.objects if o.get("wreckage_only")]; a=[o for o in bpy.data.objects if o.name.startswith("Attack-only")]; b=[o for o in t if "swept stabilizer" in o.name]; e=[o for o in t if "phase wake" in o.name]; assert len(t)==12 and len(b)==6 and len(e)==6,(len(t),len(b),len(e)); assert len(p)==6 and len(w)==10 and len(a)==5,(len(p),len(w),len(a)); assert all(o.type=="MESH" and len(o.data.vertices)==8 and len(o.data.polygons)==6 and o.hide_render for o in t); assert all(o.hide_render for o in w+a); assert bpy.data.objects.get("Independent oscillating neural iris"); print("PASS REOPEN: 12 new closed editable glide meshes, 6 petals, 10 wrecks, 5 attack meshes")'

      - name: Inspect real 160px and 80px glide PNGs and verify immutable original atlas SHA
        shell: bash
        run: |
          set -euo pipefail
          python tools/blender/qa_psionic_hallucination_four_beat_glide.py \
            --stage generated/psionic-hallucination-glide \
            --baseline archived-hallucination-source
          sha256sum --check "$RUNNER_TEMP/hallucination-baseline.sha256"
          test -s generated/psionic-hallucination-glide/psionic-hallucination-glide-contact-160.png
          test -s generated/psionic-hallucination-glide/psionic-hallucination-glide-contact-80.png
          test -s generated/psionic-hallucination-glide/psionic-hallucination-glide-facing04-80px.gif
          test -s generated/psionic-hallucination-glide/pixel-qa.json

      - name: Upload ONLY new preview source, 128 frames, contact sheets and QA
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: chrono-psionic-hallucination-four-beat-glide-preview
          path: generated/psionic-hallucination-glide/
          if-no-files-found: warn
          retention-days: 30
