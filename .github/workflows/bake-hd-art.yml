name: Bake original Blender art

# A full-roster bake is an exceptional manual release, never an automatic
# side effect of editing modeling scripts. Use Blender Asset Studio for single
# model previews and scoped approvals.
on:
  workflow_dispatch:
    inputs:
      publish_confirmation:
        description: "Type PUBLISH_ALL to confirm a full-roster replacement"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: chrono-hd-bake
  cancel-in-progress: true

jobs:
  render:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Require intentional full-roster release
        env:
          CONFIRM: ${{ github.event.inputs.publish_confirmation }}
        run: |
          if [[ "$CONFIRM" != "PUBLISH_ALL" ]]; then
            echo "::error::Use Blender Asset Studio for normal assets; full bake requires PUBLISH_ALL"
            exit 1
          fi
      - uses: actions/checkout@v4
      - name: Check original model Python syntax
        run: python3 -m py_compile tools/blender/animated_assets.py tools/blender/building_architecture.py tools/blender/pack_animated.py
      - name: Install Blender and Pillow
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends blender python3-pil
          blender --version | head -2
      - name: Author editable 3D models and animated frames
        run: |
          blender --background --threads 4 --python tools/blender/animated_assets.py -- \
            --output generated/chrono-hd \
            --kinds hq,generator,refinery,barracks,factory,radar,tech,turret,beam,airfield \
            --factions coalition,federation,psionic --size 160
          test -s generated/chrono-hd/frames/coalition/hq/idle/00_00.png
          test -s generated/chrono-hd/frames/psionic/airfield/damaged/00_00.png
      - name: Assemble and merge production art without losing deployed units
        run: |
          mkdir -p generated
          cp art/baked-v1/manifest.json generated/before-buildings.json
          python3 tools/blender/pack_animated.py \
            --input generated/chrono-hd --output art/baked-v1 --size 160
          python3 - <<'PY'
          import json
          from pathlib import Path
          old=json.loads(Path("generated/before-buildings.json").read_text())
          current=json.loads(Path("art/baked-v1/manifest.json").read_text())
          buildings={"hq","generator","refinery","barracks","factory","radar","tech","turret","beam","airfield"}
          previous={"soldier","specialist","heavy","aircraft"}
          for faction in ("coalition","federation","psionic"):
              new_entries=current["entries"][faction]
              assert set(new_entries)==buildings, (faction,new_entries.keys())
              assert previous.issubset(old["entries"][faction])
              current["entries"][faction]={**old["entries"][faction],**new_entries}
              for kind,entry in current["entries"][faction].items():
                  path=Path("art/baked-v1")/entry["file"]
                  assert path.stat().st_size>1000, path
          out=Path("art/baked-v1/manifest.json")
          out.write_text(json.dumps(current,indent=2)+"\n")
          assert len(list(Path("generated/chrono-hd/sources").glob("*.blend")))==30
          assert len(list(Path("art/baked-v1").glob("*.png")))==42
          print("Verified 30 distinctive building atlases plus 12 existing unit atlases")
          PY
      - name: Preserve editable Blender models
        run: |
          mkdir -p art/sources/blender
          cp generated/chrono-hd/sources/*.blend art/sources/blender/
      - name: Upload models and sheets for inspection
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: chrono-dominion-original-hd-art
          path: |
            art/baked-v1/
            art/sources/blender/
          if-no-files-found: warn
          retention-days: 30
      - name: Commit rendered originals into playable game
        run: |
          git config user.name "Chrono Dominion Art Pipeline"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add art/baked-v1 art/sources/blender
          if git diff --cached --quiet; then
            echo "All animation atlases are current"
            exit 0
          fi
          git commit -m "Bake original Blender 3D models and animated sprite sheets"
          for attempt in 1 2 3; do
            if git pull --rebase origin main && git push origin HEAD:main; then
              echo "Pushed rendered models and atlases"
              exit 0
            fi
            echo "Retrying art push, attempt $attempt"
            sleep 5
          done
          exit 1
