name: Federation Technology Lab MK-III Mechanical Idle Review

# Preview-only targeted 3D geometry verification; no production art writes.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/federation-tech-clamp-review.yml"
      - "tools/blender/qa_federation_tech_clamp.py"

permissions:
  contents: read

concurrency:
  group: chrono-federation-tech-clamp-preview
  cancel-in-progress: true

jobs:
  render-and-inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Validate Python and geometry signatures
        run: |
          python -m py_compile tools/blender/animated_assets.py tools/blender/building_architecture.py tools/blender/qa_federation_tech_clamp.py
          python tools/blender/check_geometry_calls.py
          python -m pip install --quiet Pillow

      - name: Cache verified Blender 4.2.23 LTS binary
        uses: actions/cache@v4
        with:
          path: ~/.cache/chrono-blender/blender-4.2.23-linux-x64.tar.xz
          key: chrono-blender-4.2.23-linux-x64-official

      - name: Install verified official Blender binary without apt mirrors
        shell: bash
        run: |
          set -euo pipefail
          version=4.2.23
          name="blender-${version}-linux-x64.tar.xz"
          base="https://download.blender.org/release/Blender4.2"
          mkdir -p "$HOME/.cache/chrono-blender" "$RUNNER_TEMP/chrono-blender"
          archive="$HOME/.cache/chrono-blender/$name"
          if [[ ! -s "$archive" ]]; then
            curl --fail --location --retry 3 --retry-delay 4 \
              --connect-timeout 25 --max-time 480 \
              "$base/$name" --output "$archive"
          fi
          curl --fail --location --retry 3 --connect-timeout 20 \
            --max-time 90 "$base/blender-${version}.sha256" \
            --output "$RUNNER_TEMP/blender.sha256"
          grep -F "$name" "$RUNNER_TEMP/blender.sha256" | head -1 | \
            (cd "$HOME/.cache/chrono-blender" && sha256sum --check)
          tar -xJf "$archive" -C "$RUNNER_TEMP/chrono-blender" \
            --strip-components=1
          echo "$RUNNER_TEMP/chrono-blender" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/chrono-blender/blender" --version | head -2

      - name: Render only the updated Federation Technology Lab
        shell: bash
        run: |
          set -euo pipefail
          stage="generated/federation-tech-clamp/federation/tech"
          blender --background --threads 4 --python-exit-code 1 \
            --python tools/blender/animated_assets.py -- \
            --output "$stage" --kinds tech --factions federation --size 160
          python tools/blender/pack_animated.py \
            --input "$stage" --output "$stage/packed" --size 160
          python tools/blender/asset_studio.py validate \
            --stage "$stage" --faction federation --kind tech
          python tools/blender/asset_studio.py preview \
            --stage "$stage" --faction federation --kind tech

      - name: Reopen saved Blender and validate editable clamp geometry
        shell: bash
        run: |
          set -euo pipefail
          blender --background --threads 2 \
            generated/federation-tech-clamp/federation/tech/sources/federation-tech.blend \
            --python-exit-code 1 \
            --python-expr 'import bpy; a=[o for o in bpy.data.objects if o.type=="MESH"]; c=[o for o in a if "Animated exposed twin jaw siege test clamp" in o.name]; assert len(c)==1,(len(c),[o.name for o in a]); assert len(c[0].data.vertices)>=20; assert len(c[0].data.polygons)>=12; print("REOPENED EDITABLE CLAMP",c[0].name,"vertices",len(c[0].data.vertices),"meshes",len(a))'

      - name: Inspect real RGBA pixels at 80px and 160px
        run: python tools/blender/qa_federation_tech_clamp.py

      - name: Upload editable Blender source and rendered inspection sheets
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: chrono-federation-tech-mkiii-mechanical-idle
          path: generated/federation-tech-clamp/
          if-no-files-found: warn
          retention-days: 30
