name: Psionic Crystal Damage Silhouette Review

# Original editable Blender geometry. Preview-only: never publish live textures.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/psionic-crystal-damage-review.yml"

permissions:
  contents: read

concurrency:
  group: chrono-psionic-crystal-damage-qa
  cancel-in-progress: true

jobs:
  render-psionic:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Python and Pillow
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Preflight modeling syntax and helper signatures
        run: |
          python -m py_compile tools/blender/building_architecture.py \
            tools/blender/animated_assets.py tools/blender/qa_psionic_crystal_damage.py \
            tools/blender/pack_animated.py tools/blender/asset_studio.py
          python tools/blender/check_geometry_calls.py
          python -m pip install --quiet Pillow

      - name: Cache official Blender 4.2.23 LTS binary
        uses: actions/cache@v4
        with:
          path: ~/.cache/chrono-blender/blender-4.2.23-linux-x64.tar.xz
          key: chrono-blender-4.2.23-linux-x64-official

      - name: Install checksum-verified Blender without apt mirrors
        shell: bash
        run: |
          set -euo pipefail
          version=4.2.23
          name="blender-${version}-linux-x64.tar.xz"
          base="https://download.blender.org/release/Blender4.2"
          mkdir -p "$HOME/.cache/chrono-blender" "$RUNNER_TEMP/chrono-blender"
          archive="$HOME/.cache/chrono-blender/$name"
          if [[ ! -s "$archive" ]]; then
            curl --fail --location --retry 3 --retry-delay 4 \
              --connect-timeout 25 --max-time 480 \
              "$base/$name" --output "$archive"
          fi
          curl --fail --location --retry 3 --connect-timeout 20 \
            --max-time 90 "$base/blender-${version}.sha256" \
            --output "$RUNNER_TEMP/blender.sha256"
          grep -F "$name" "$RUNNER_TEMP/blender.sha256" | head -1 | \
            (cd "$HOME/.cache/chrono-blender" && sha256sum --check)
          tar -xJf "$archive" -C "$RUNNER_TEMP/chrono-blender" \
            --strip-components=1
          echo "$RUNNER_TEMP/chrono-blender" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/chrono-blender/blender" --version | head -2

      - name: Render only Psionic HQ Refinery Barracks
        shell: bash
        run: |
          set -euo pipefail
          for kind in hq refinery barracks; do
            stage="generated/psionic-crystal-damage-qa/psionic/$kind"
            echo "::group::Blender Psionic / $kind"
            blender --background --threads 4 --python-exit-code 1 \
              --python tools/blender/animated_assets.py -- \
              --output "$stage" --kinds "$kind" --factions psionic --size 160
            python tools/blender/pack_animated.py \
              --input "$stage" --output "$stage/packed" --size 160
            python tools/blender/asset_studio.py validate \
              --stage "$stage" --faction psionic --kind "$kind"
            python tools/blender/asset_studio.py preview \
              --stage "$stage" --faction psionic --kind "$kind"
            test -s "$stage/sources/psionic-$kind.blend"
            blender --background --threads 2 \
              "$stage/sources/psionic-$kind.blend" --python-exit-code 1 \
              --python-expr 'import bpy; a=[o for o in bpy.data.objects if o.type=="MESH"]; c=[o for o in a if o.name.startswith("Damage-only fallen psionic crystal")]; assert len(c)==3,(len(c),[o.name for o in a]); assert all(o.hide_render for o in c); assert any("Damage-only shattered psionic roof cavity" in o.name for o in a); assert any("Temporary build scaffold" in o.name for o in a); print("REOPENED THREE EDITABLE PSIONIC CRYSTAL WRECKS",len(a))'
            echo "::endgroup::"
          done

      - name: Validate alpha changes and generate 160px 80px contact sheets
        run: python tools/blender/qa_psionic_crystal_damage.py

      - name: Upload preview Blender sources atlases and image QA
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: chrono-psionic-crystal-damage-mkiv-review
          path: generated/psionic-crystal-damage-qa/
          if-no-files-found: warn
          retention-days: 30
