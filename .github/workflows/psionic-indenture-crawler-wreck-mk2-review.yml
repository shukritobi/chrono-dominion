name: Psionic Indenture Crawler MK-II — Destroyed-Only Physical Correction

# PREVIEW ONLY. Copies 96 validated frames from run 40784608098.
# Only 32 destroyed directions are rerendered. No game art is published.
on:
  workflow_dispatch:
  push:
    branches:
      - asset-preview/psionic-indenture-crawler-32-20261029
    paths:
      - .github/workflows/psionic-indenture-crawler-wreck-mk2-review.yml
      - tools/blender/preview_psionic_indenture_crawler_wreck_mk2.py
      - tools/blender/qa_psionic_indenture_crawler_wreck_mk2.py

permissions:
  contents: read
  actions: read

concurrency:
  group: chrono-psionic-indenture-crawler-wreck-mk2
  cancel-in-progress: true

jobs:
  targeted-wreck-review:
    runs-on: ubuntu-24.04
    timeout-minutes: 85
    steps:
      - name: Checkout isolated unapproved preview branch
        uses: actions/checkout@v4

      - name: Compile scripts and install Pillow
        run: |
          set -euo pipefail
          python -m py_compile tools/blender/preview_coalition_carrier_32.py tools/blender/preview_psionic_indenture_crawler_32.py tools/blender/preview_psionic_indenture_crawler_wreck_mk2.py tools/blender/qa_psionic_indenture_crawler_32.py tools/blender/qa_psionic_indenture_crawler_wreck_mk2.py
          python -m pip install --quiet Pillow

      - name: Download exact successful original baseline, preserve 96 frames
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh run download 40784608098 --repo "$GITHUB_REPOSITORY" \
            --name chrono-psionic-indenture-crawler-32-preview \
            --dir generated/psionic-indenture-crawler-original
          for state in idle move harvest destroyed; do
            test "$(find "generated/psionic-indenture-crawler-original/frames/$state" -name '*.png' | wc -l)" -eq 32
          done
          test -s generated/psionic-indenture-crawler-original/pixel-qa.json
          mkdir -p generated/psionic-indenture-crawler-wreck-mk2/frames
          for state in idle move harvest; do
            cp -a "generated/psionic-indenture-crawler-original/frames/$state" \
              generated/psionic-indenture-crawler-wreck-mk2/frames/
          done

      - name: Cache official Blender 4.2.23 LTS
        uses: actions/cache@v4
        with:
          path: ~/.cache/chrono-blender/blender-4.2.23-linux-x64.tar.xz
          key: chrono-blender-4.2.23-linux-x64-official

      - name: Install checksum-verified Blender
        shell: bash
        run: |
          set -euo pipefail
          version=4.2.23
          name="blender-${version}-linux-x64.tar.xz"
          base="https://download.blender.org/release/Blender4.2"
          mkdir -p "$HOME/.cache/chrono-blender" "$RUNNER_TEMP/chrono-blender"
          archive="$HOME/.cache/chrono-blender/$name"
          if [[ ! -s "$archive" ]]; then
            curl --fail --location --retry 3 --retry-delay 4 --connect-timeout 25 --max-time 480 "$base/$name" --output "$archive"
          fi
          curl --fail --location --retry 3 --connect-timeout 20 --max-time 90 "$base/blender-${version}.sha256" --output "$RUNNER_TEMP/blender.sha256"
          grep -F "$name" "$RUNNER_TEMP/blender.sha256" | head -1 | (cd "$HOME/.cache/chrono-blender" && sha256sum --check)
          tar -xJf "$archive" -C "$RUNNER_TEMP/chrono-blender" --strip-components=1
          echo "$RUNNER_TEMP/chrono-blender" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/chrono-blender/blender" --version | head -2

      - name: Render ONLY the 32 corrected destroyed facings
        run: |
          set -euo pipefail
          blender --background --threads 4 --python-exit-code 1 \
            --python tools/blender/preview_psionic_indenture_crawler_wreck_mk2.py -- \
            --output generated/psionic-indenture-crawler-wreck-mk2
          test "$(find generated/psionic-indenture-crawler-wreck-mk2/frames/destroyed -name '*.png' | wc -l)" -eq 32

      - name: Reopen saved source and inspect actual new fracture topology
        run: |
          set -euo pipefail
          blender --background --threads 2 \
            generated/psionic-indenture-crawler-wreck-mk2/psionic-indenture-crawler-wreck-mk2.blend \
            --python-exit-code 1 --python-expr '
          import bpy, bmesh
          mk2=[o for o in bpy.data.objects if o.type=="MESH" and o.get("mk2_wreck_only")]
          original=[o for o in bpy.data.objects if o.type=="MESH" and "cutting drum" in o.name.lower()]
          baseline=[o for o in bpy.data.objects if o.type=="MESH" and o.get("closed_fracture") and not o.get("mk2_wreck_only")]
          assert len(mk2)==4 and len(original)==4 and len(baseline)==12,(len(mk2),len(original),len(baseline))
          assert all(o.hide_render and o.get("wreckage_only") for o in mk2)
          assert all(not o.hide_render for o in original)
          for o in mk2:
              bm=bmesh.new();bm.from_mesh(o.data)
              assert len(bm.verts)==12 and len(bm.faces)==8
              assert all(e.is_manifold for e in bm.edges),o.name
              bm.free()
          print("PASS MK-II REOPEN: four hidden manifold cutter fragments; all four original cutter drums retained in intact source")
          '

      - name: Strict 128-frame 80px QA and byte-identical baseline preservation
        run: |
          set -euo pipefail
          python tools/blender/qa_psionic_indenture_crawler_32.py --stage generated/psionic-indenture-crawler-wreck-mk2
          python tools/blender/qa_psionic_indenture_crawler_wreck_mk2.py \
            --stage generated/psionic-indenture-crawler-wreck-mk2 \
            --baseline generated/psionic-indenture-crawler-original
          test -s generated/psionic-indenture-crawler-wreck-mk2/psionic-indenture-crawler-contact-80.png
          test -s generated/psionic-indenture-crawler-wreck-mk2/psionic-indenture-crawler-contact-160.png

      - name: Upload revised editable source, 96 original frames and 32 new wrecks
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: chrono-psionic-indenture-crawler-wreck-mk2-preview
          path: generated/psionic-indenture-crawler-wreck-mk2/
          if-no-files-found: warn
          retention-days: 30
