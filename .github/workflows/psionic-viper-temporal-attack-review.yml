name: Psionic Viper Four-Phase Twin-Lance Blender Preview

# PREVIEW ONLY. Reuse archived validated .blend; never publish game textures.
on:
  workflow_dispatch:
  push:
    branches:
      - asset-preview/psionic-viper-temporal-attack-20261027
    paths:
      - .github/workflows/psionic-viper-temporal-attack-review.yml
      - tools/blender/preview_psionic_viper_temporal_attack.py
      - tools/blender/qa_psionic_viper_temporal_attack.py

permissions:
  contents: read
  actions: read

concurrency:
  group: chrono-psionic-viper-temporal-attack-review
  cancel-in-progress: true

jobs:
  temporal-review:
    runs-on: ubuntu-24.04
    timeout-minutes: 85
    steps:
      - name: Checkout preview-only branch
        uses: actions/checkout@v4

      - name: Compile original Blender and pixel QA scripts
        run: |
          set -euo pipefail
          python -m py_compile tools/blender/preview_psionic_viper_temporal_attack.py tools/blender/qa_psionic_viper_temporal_attack.py
          python -m pip install --quiet Pillow

      - name: Download already validated Viper source without rerendering
        uses: actions/download-artifact@v4
        with:
          name: chrono-psionic-viper-light-tank-32-preview
          run-id: 40508990419
          github-token: ${{ github.token }}
          path: archived-viper-source

      - name: Verify baseline source and preserve atlas checksum
        run: |
          set -euo pipefail
          test -s archived-viper-source/psionic-viper-light-tank.blend
          test -s archived-viper-source/psionic-viper-light-tank-32-preview.png
          test -s archived-viper-source/frames/idle/00.png
          test -s archived-viper-source/frames/attack/31.png
          sha256sum archived-viper-source/psionic-viper-light-tank-32-preview.png > "$RUNNER_TEMP/original-atlas.sha256"

      - name: Cache official Blender 4.2.23 LTS
        uses: actions/cache@v4
        with:
          path: ~/.cache/chrono-blender/blender-4.2.23-linux-x64.tar.xz
          key: chrono-blender-4.2.23-linux-x64-official

      - name: Install checksum-verified Blender
        shell: bash
        run: |
          set -euo pipefail
          version=4.2.23
          name="blender-$version-linux-x64.tar.xz"
          base="https://download.blender.org/release/Blender4.2"
          mkdir -p "$HOME/.cache/chrono-blender" "$RUNNER_TEMP/chrono-blender"
          archive="$HOME/.cache/chrono-blender/$name"
          if [[ ! -s "$archive" ]]; then
            curl --fail --location --retry 3 --retry-delay 4 \
              --connect-timeout 25 --max-time 480 "$base/$name" --output "$archive"
          fi
          curl --fail --location --retry 3 --connect-timeout 20 --max-time 90 \
            "$base/blender-$version.sha256" --output "$RUNNER_TEMP/blender.sha256"
          grep -F "$name" "$RUNNER_TEMP/blender.sha256" | head -1 | \
            (cd "$HOME/.cache/chrono-blender" && sha256sum --check)
          tar -xJf "$archive" -C "$RUNNER_TEMP/chrono-blender" --strip-components=1
          echo "$RUNNER_TEMP/chrono-blender" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/chrono-blender/blender" --version | head -2

      - name: Render only 128 NEW four-phase Viper attack frames
        shell: bash
        run: |
          set -euo pipefail
          blender --background --threads 4 \
            archived-viper-source/psionic-viper-light-tank.blend \
            --python-exit-code 1 \
            --python tools/blender/preview_psionic_viper_temporal_attack.py -- \
            --output generated/psionic-viper-temporal-attack

      - name: Reopen editable Blender source and check 13 original attack objects
        shell: bash
        run: |
          set -euo pipefail
          blender --background --threads 2 \
            generated/psionic-viper-temporal-attack/psionic-viper-temporal-attack.blend \
            --python-exit-code 1 --python-expr \
            'import bpy; t=[o for o in bpy.data.objects if o.get("viper_temporal_only")]; w=[o for o in bpy.data.objects if o.get("wreckage_only")]; assert len(t)==13,(len(t),[o.name for o in t]); assert len(w)==8,len(w); assert all(o.hide_render for o in t+w); assert len([o for o in t if o.type=="MESH"])==9; assert len([o for o in t if o.type=="CURVE"])==4; print("PASS REOPEN: 4 RINGS, 3 LANCES, 4 CURVES, 2 ION SHARDS, 8 WRECKAGE MESHES")'

      - name: Inspect 160px and 80px PNGs and unchanged original atlas
        shell: bash
        run: |
          set -euo pipefail
          python tools/blender/qa_psionic_viper_temporal_attack.py \
            --stage generated/psionic-viper-temporal-attack \
            --baseline archived-viper-source
          sha256sum --check "$RUNNER_TEMP/original-atlas.sha256"
          test -s generated/psionic-viper-temporal-attack/psionic-viper-temporal-attack-contact-160.png
          test -s generated/psionic-viper-temporal-attack/psionic-viper-temporal-attack-contact-80.png
          test -s generated/psionic-viper-temporal-attack/pixel-qa.json

      - name: Upload preview-only source and four-phase visual QA
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: chrono-psionic-viper-temporal-attack-preview
          path: generated/psionic-viper-temporal-attack/
          if-no-files-found: warn
          retention-days: 30
