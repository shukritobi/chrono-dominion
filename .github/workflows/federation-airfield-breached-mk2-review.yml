name: Federation Airfield MK-II Physically Breached Hangar Preview

# Preview only. Reuse validated artifact; NEVER publish live textures.
on:
  workflow_dispatch:
  push:
    branches: [asset-preview/federation-airfield-breached-hangar-mk2-20261029]
    paths:
      - '.github/workflows/federation-airfield-breached-mk2-review.yml'
      - 'tools/blender/preview_federation_airfield_breached_mk2.py'
      - 'tools/blender/verify_federation_airfield_breached_mk2.py'
      - 'tools/blender/qa_federation_airfield_breached_mk2.py'

permissions:
  contents: read
  actions: read

concurrency:
  group: chrono-federation-airfield-breach-mk2-preview
  cancel-in-progress: true

jobs:
  render-one-wreck:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    steps:
      - name: Checkout development-only Blender source
        uses: actions/checkout@v4

      - name: Download prior validated three-faction airfield artifact (no baseline rerenders)
        uses: actions/download-artifact@v4
        with:
          name: chrono-three-faction-airfield-extra-state-pilot
          run-id: 40791963017
          github-token: ${{ github.token }}
          path: generated/federation-airfield-breach-mk2

      - name: Verify exact source baseline and snapshot untouched art
        shell: bash
        run: |
          set -euo pipefail
          stage=generated/federation-airfield-breach-mk2
          echo '78758cb231e0f4c41f68a986f2d142ea65f0bc26d08a1eb0f44c1ad169da096e  '"$stage/extra/federation/federation-airfield-extended-states.blend" | sha256sum --check
          echo '4952e83ea7c4ca60616d92338ae7f66237b3a32dbb55f75053c571f1498f1608  '"$stage/extra/federation/destroyed.png" | sha256sum --check
          echo 'b0dde06c0e7793b577b10d7561765b184d2a6c07a48e6c140ff53fc3b9a0f60f  '"$stage/packed/federation-airfield.png" | sha256sum --check
          {
            for faction in coalition psionic; do
              for state in critical destroyed power_out; do
                sha256sum "$stage/extra/$faction/$state.png"
              done
            done
            for state in critical power_out; do
              sha256sum "$stage/extra/federation/$state.png"
            done
            sha256sum "$stage/packed/"{coalition,federation,psionic}-airfield.png
            sha256sum "$stage/packed/manifest.json"
          } > "$stage/unchanged-baseline.sha256"
          cp "$stage/extra/federation/destroyed.png" "$stage/extra/federation/destroyed-original.png"

      - name: Compile scripts and install Pillow
        run: |
          set -euo pipefail
          python -m pip install --quiet Pillow
          python -m py_compile \
            tools/blender/preview_federation_airfield_breached_mk2.py \
            tools/blender/verify_federation_airfield_breached_mk2.py \
            tools/blender/qa_federation_airfield_breached_mk2.py

      - name: Cache checksum-verified Blender 4.2.23 LTS
        uses: actions/cache@v4
        with:
          path: ~/.cache/chrono-blender/blender-4.2.23-linux-x64.tar.xz
          key: chrono-blender-4.2.23-linux-x64-official

      - name: Install official checksum-verified Blender
        shell: bash
        run: |
          set -euo pipefail
          version=4.2.23
          name="blender-${version}-linux-x64.tar.xz"
          base="https://download.blender.org/release/Blender4.2"
          mkdir -p "$HOME/.cache/chrono-blender" "$RUNNER_TEMP/chrono-blender"
          archive="$HOME/.cache/chrono-blender/$name"
          if [[ ! -s "$archive" ]]; then
            curl --fail --location --retry 3 --retry-delay 4 \
              --connect-timeout 25 --max-time 480 "$base/$name" --output "$archive"
          fi
          curl --fail --location --retry 3 --connect-timeout 20 --max-time 90 \
            "$base/blender-${version}.sha256" --output "$RUNNER_TEMP/blender.sha256"
          grep -F "$name" "$RUNNER_TEMP/blender.sha256" | head -1 | \
            (cd "$HOME/.cache/chrono-blender" && sha256sum --check)
          tar -xJf "$archive" -C "$RUNNER_TEMP/chrono-blender" --strip-components=1
          echo "$RUNNER_TEMP/chrono-blender" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/chrono-blender/blender" --version | head -2

      - name: Render ONLY Federation destroyed MK-II from existing saved Blender source
        shell: bash
        run: |
          set -euo pipefail
          stage=generated/federation-airfield-breach-mk2
          blender --background --threads 4 \
            "$stage/extra/federation/federation-airfield-extended-states.blend" \
            --python-exit-code 1 \
            --python tools/blender/preview_federation_airfield_breached_mk2.py -- \
            --output "$stage/extra/federation"
          cp "$stage/extra/federation/destroyed-mk2.png" "$stage/extra/federation/destroyed.png"

      - name: Reopen saved editable Blender source and independently audit all ten manifold solids
        shell: bash
        run: |
          set -euo pipefail
          stage=generated/federation-airfield-breach-mk2
          blender --background --threads 2 \
            "$stage/extra/federation/federation-airfield-breached-mk2.blend" \
            --python-exit-code 1 \
            --python tools/blender/verify_federation_airfield_breached_mk2.py

      - name: Pixel QA at 160px and 80px plus strict unchanged SHA verification
        shell: bash
        run: |
          set -euo pipefail
          stage=generated/federation-airfield-breach-mk2
          python tools/blender/qa_federation_airfield_breached_mk2.py --stage "$stage"
          sha256sum --check "$stage/unchanged-baseline.sha256"

      - name: Upload review-only model and real PNG inspection results even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: chrono-federation-airfield-breached-mk2-preview
          path: generated/federation-airfield-breach-mk2/
          if-no-files-found: warn
          retention-days: 30
