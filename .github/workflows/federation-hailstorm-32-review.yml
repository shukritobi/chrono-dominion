name: Federation Hailstorm Rocket Artillery 32-Facing Blender Preview

# Original Blender modeling review only. Never publish or overwrite game art.
on:
  workflow_dispatch:
  push:
    branches:
      - asset-preview/federation-hailstorm-artillery-32-20261027
    paths:
      - .github/workflows/federation-hailstorm-32-review.yml
      - tools/blender/preview_federation_hailstorm_32.py
      - tools/blender/qa_federation_hailstorm_32.py

permissions:
  contents: read

concurrency:
  group: chrono-federation-hailstorm-32-review
  cancel-in-progress: true

jobs:
  render-review:
    runs-on: ubuntu-24.04
    timeout-minutes: 85
    steps:
      - name: Checkout original preview branch
        uses: actions/checkout@v4

      - name: Compile modeling and QA scripts
        run: |
          set -euo pipefail
          python -m py_compile tools/blender/preview_coalition_carrier_32.py tools/blender/preview_federation_hailstorm_32.py tools/blender/qa_federation_hailstorm_32.py
          python -m pip install --quiet Pillow

      - name: Cache official Blender 4.2.23 LTS
        uses: actions/cache@v4
        with:
          path: ~/.cache/chrono-blender/blender-4.2.23-linux-x64.tar.xz
          key: chrono-blender-4.2.23-linux-x64-official

      - name: Install checksum-verified Blender
        shell: bash
        run: |
          set -euo pipefail
          version=4.2.23
          name="blender-${version}-linux-x64.tar.xz"
          base="https://download.blender.org/release/Blender4.2"
          mkdir -p "$HOME/.cache/chrono-blender" "$RUNNER_TEMP/chrono-blender"
          archive="$HOME/.cache/chrono-blender/$name"
          if [[ ! -s "$archive" ]]; then
            curl --fail --location --retry 3 --retry-delay 4 \
              --connect-timeout 25 --max-time 480 "$base/$name" --output "$archive"
          fi
          curl --fail --location --retry 3 --connect-timeout 20 --max-time 90 \
            "$base/blender-${version}.sha256" --output "$RUNNER_TEMP/blender.sha256"
          grep -F "$name" "$RUNNER_TEMP/blender.sha256" | head -1 | \
            (cd "$HOME/.cache/chrono-blender" && sha256sum --check)
          tar -xJf "$archive" -C "$RUNNER_TEMP/chrono-blender" --strip-components=1
          echo "$RUNNER_TEMP/chrono-blender" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/chrono-blender/blender" --version | head -2

      - name: Render only the new Federation Hailstorm artillery
        shell: bash
        run: |
          set -euo pipefail
          blender --background --threads 4 --python-exit-code 1 \
            --python tools/blender/preview_federation_hailstorm_32.py -- \
            --output generated/federation-hailstorm-32

      - name: Reopen Blender source and verify hidden editable wreckage
        shell: bash
        run: |
          set -euo pipefail
          blender --background --threads 2 \
            generated/federation-hailstorm-32/federation-hailstorm-rocket-artillery.blend \
            --python-exit-code 1 --python-expr \
            'import bpy; obs=list(bpy.data.objects); wreck=[o for o in obs if o.type=="MESH" and o.get("wreckage_only")]; assert len(wreck)==6,(len(wreck),[o.name for o in wreck]); assert all(o.hide_render for o in wreck); assert len([o for o in obs if o.name.startswith("Independent rotating roadwheel")])==8; assert len([o for o in obs if o.name.startswith("Separated triple rocket cassette")])==2; assert len([o for o in obs if o.name.startswith("Independent live missile barrel")])==6; print("PASS REOPEN: SIX HIDDEN WRECKAGE MESHES, EIGHT WHEELS, TWO ROCKET CASSETTES, SIX MISSILE BARRELS")'

      - name: Inspect 128 actual 160px and 80px PNGs
        shell: bash
        run: |
          set -euo pipefail
          python tools/blender/qa_federation_hailstorm_32.py --stage generated/federation-hailstorm-32
          test -s generated/federation-hailstorm-32/federation-hailstorm-contact-160.png
          test -s generated/federation-hailstorm-32/federation-hailstorm-contact-80.png
          test -s generated/federation-hailstorm-32/pixel-qa.json

      - name: Upload preview-only editable model and visual QA
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: chrono-federation-hailstorm-32-facing-preview
          path: generated/federation-hailstorm-32/
          if-no-files-found: warn
          retention-days: 30
